# gsxkit's components' text, which go tool gsxkit add writes into an app's catalogs, translated.

# gsxkit's map (go tool gsxkit add map: views/gsxkit/map.gsx).
[gsxkit.map]
# The map's button that zooms in (an icon; this is its name for screen readers and its tooltip).
zoom_in = "Zoom in"
# The map's button that zooms out.
zoom_out = "Zoom out"
# The map's button that asks the browser for the reader's location and marks it.
locate = "Show my location"
# Over the map, when the reader refused the browser's request for their location.
denied = "Location permission was refused. Allow it in your browser's site settings and try again."
# Over the map, when the browser couldn't tell where the reader is.
unavailable = "Your location isn't available."
# The name and popup of the pin at the reader's own location.
you = "You are here"
# The map's credit for its tiles, in its corner, linking to OpenStreetMap's copyright page. Keep OpenStreetMap as it is.
attribution = "© OpenStreetMap contributors"

# gsxkit's live video over MoQ (go tool gsxkit add moq: views/gsxkit/moq.gsx).
[gsxkit.moq]
watch_title = "Watch"
watch_description = "The broadcast the link you opened names."
broadcast_title = "Broadcast"
broadcast_description = "Your camera and microphone, sent to the relay. Nothing is captured until you press start."
state_connecting = "Connecting"
state_waiting = "Waiting for a broadcast"
state_playing = "Live"
state_paused = "Paused"
state_reconnecting = "Reconnecting"
state_ended = "Broadcast ended"
state_unsupported = "Not supported in this browser"
state_idle = "Camera off"
state_requesting = "Asking for your camera"
state_on_air = "On air"
state_failed = "Camera failed"
error_denied = "Camera or microphone permission was refused. Allow it in your browser's site settings and try again."
error_unavailable = "No camera was found, or another app is using it."
error_failed = "The camera could not start."
play = "Play"
pause = "Pause"
unmute = "Unmute"
mute = "Mute"
fullscreen = "Full screen"
start_camera = "Start camera"
stop = "Stop"
mic_off = "Mute microphone"
mic_on = "Unmute microphone"
share = "Send this link to whoever should watch"
# The button beside the link to send, on air: copies it.
copy_link = "Copy link"
# What the copy button says for a moment after copying.
copied = "Copied"
# The button beside the link to send, on phones: opens the system's share sheet.
share_link = "Share"
# Under the link to send, on air.
keep_open = "Keep this page open while you're live: on a phone, switching apps or locking the screen pauses the broadcast until you come back."
# The disclosure under each video that shows the connection's technical details.
details = "Connection details"
