# intl's mise tasks: an app's languages, every workflow a go tool intl command (intl/README.md). In an app,
# go tool intl tasks writes this file to .mise/tasks/intl.toml, one of mise's default task directories, from the intl
# version in go.mod; intl:check says when an upgrade changed it. Intl itself (plural categories, language names) runs
# on workerd, which these tasks pin.

["intl"]
description = "Compile the catalogs (intl.toml): the Go package of messages, intl-messages.mjs, the gsxui translator and intl.sum; a language just added to intl.toml's locales gets its catalog. Run it after editing a catalog; gsx generate needs it first"
run = "go tool intl gen"

["intl:status"]
description = "Per locale: translated, inherited, stale and missing messages; exits 1 when a locale is incomplete"
run = "go tool intl status"

["intl:todo"]
description = "What is left to translate, per locale: each message's source, context and arguments, the plural categories the language needs, the style note (--json for agents)"
tools = { workerd = "1.20261019.1" }
usage = '''
flag "--json" help="JSON on stdout, for agents"
arg "[locale]" var=#true help="only these locales (default: all)"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
args=(); [ "${usage_json:-}" != true ] || args+=(-json)
exec go tool intl todo ${args[@]+"${args[@]}"} ${usage_locale:-}
'''

["intl:translate"]
description = "Translate every missing and stale message with Claude Code (the intl-translate skill), one worker per language at once (intl.toml [translate]), until intl:check passes. Needs claude on PATH"
tools = { workerd = "1.20261019.1" }
usage = '''
arg "[locale]" var=#true help="only these locales (default: all)"
'''
run = "go tool intl translate ${usage_locale:-}"

["intl:check"]
description = "Every problem, for CI: the catalogs (ICU syntax, arguments, a case for each plural category Intl says a language uses, missing and stale translations, unused messages, gsxui text, intl.sum), then gsx's own checks on the app's markup (gsx generate, gsx fmt, the gsx skill's find-smells.sh); exits 1 on any"
depends = ["intl"]
tools = { workerd = "1.20261019.1" }
run = '''
#!/usr/bin/env bash
set -uo pipefail
status=0
go tool intl check || status=1
# gsx's own tools on the app's markup (go tool intl markup: not gsxui's vendored components, not nested modules):
# every renderer and filter resolves, the formatting is gsx fmt's, and the gsx skill's smell finder has nothing to say.
dirs=$(go tool intl markup)
go tool gsx generate -q || status=1
if [ -n "$dirs" ]; then
  unformatted=$(go tool gsx fmt -l $dirs)
  [ -z "$unformatted" ] || { echo "✗ gsx fmt -w these: $unformatted"; status=1; }
  smells="$(go list -m -f '{% raw %}{{.Dir}}{% endraw %}' github.com/gsxhq/gsx)/skills/gsx/scripts/find-smells.sh"
  # The one shape the smell finder can't tell apart: a message with arguments alone on a line, { locales.X(arg) },
  # is a typed value with a renderer, not a component called as a function.
  msg="^[^:]+:[0-9]+:[[:space:]]*[{][[:space:]]*$(go tool intl catalogs)[.][A-Z][A-Za-z0-9]*[(]"
  for dir in $dirs; do
    hits=$(bash "$smells" "$dir" | awk -v msg="$msg" '
      /^== / { section = $0; next }
      /^$/ { next }
      section ~ /component called as a Go function/ && $0 ~ msg { next }
      { if (section != shown) { print section; shown = section } print }') || { echo "✗ gsx smells: find-smells.sh failed"; status=1; }
    [ -z "$hits" ] || { echo "✗ gsx smells (find-smells.sh):"; echo "$hits"; status=1; }
  done
fi
[ $status != 0 ] || echo "✓ gsx: generate, fmt, smells"
exit $status
'''

["intl:confirm"]
description = "Keep stale translations as they are: the source changed, their meaning didn't (a typo fixed). All of them, or only some: de, or de:board.notes"
usage = 'arg "[which]" var=#true help="de, or de:board.notes (default: every stale translation)"'
run = "go tool intl confirm ${usage_which:-}"

["intl:export"]
description = "XLIFF 2.0 per locale into xliff/ (intl.toml's xliff), for human translators and translation-management systems: what is left to translate (--all: every message)"
tools = { workerd = "1.20261019.1" }
usage = '''
flag "--all" help="every message, not only what is left"
arg "[locale]" var=#true help="only these locales (default: all)"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
args=(); [ "${usage_all:-}" != true ] || args+=(-all)
exec go tool intl export ${args[@]+"${args[@]}"} ${usage_locale:-}
'''

["intl:import"]
description = "Read translators' XLIFF 2.0 back into the catalogs, each target checked against its source: every file in xliff/, or the ones named; then compile"
usage = 'arg "[file]" var=#true help="<locale>.xlf files (default: all of xliff/)"'
run = "go tool intl import ${usage_file:-}"

["intl:tasks"]
description = "Write this file again from the intl version in go.mod: run it after upgrading intl (intl:check says when)"
run = "go tool intl tasks"

["intl:skill"]
description = "Install or update the intl-translate agent skill (.claude/skills), which Claude Code uses to translate"
run = "go tool intl skill"
