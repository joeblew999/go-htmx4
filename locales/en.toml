# go-htmx4 UI strings: the source catalog. ICU MessageFormat 1 (plural, selectordinal, select, number).
# Translations live next to it as <locale>.toml with the same keys; `mise run intl` generates a typed constructor per
# key in this package ({ locales.HomeHeading() } in markup, an intl.Msg). [gsxui] is the text gsxui components write
# themselves (intl.toml gsxui). Brand and technical names (gsx, htmx, D1, Durable Objects, TinyGo, Workers) stay as
# they are in every language.

