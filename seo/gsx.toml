# seo is a library other modules import: its .x.go (head.gsx's seo.Head) is generated here (go -C seo tool gsx
# generate) and committed, as the gsx Package renderers guide says for a package outside the consuming module. This
# file also stops the app's gsx.toml from being inherited.

# gsx's lints (gsx's Configuration guide, "Lints"), as errors: gsx generate, which every build, test and CI run calls,
# fails on one instead of printing a warning nobody reads. go tool gsx info lists them and their levels.
[lint]
child-element-spacing = "error"
duplicate-attribute = "error"
self-reference-leaf = "error"
url-always-blocked = "error"
wrapper-cycle = "error"
