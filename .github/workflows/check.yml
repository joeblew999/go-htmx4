# Runs `mise run check` (TinyGo under workerd + go test) and `mise run e2e` (headless Chrome) on every push and pull
# request to main.
# Strict no-Node: shell `run:` steps only, no JavaScript actions (plan: .plans/done/2026-09-14_0915_ci-mise-check.md).
name: check

# Every branch push (a PR's checks are its head branch's push run). The build is also published for Cloudflare's
# preview of that commit (ci/check.sh → release "preview-builds"; ci/workers-builds.sh deploys it, compiling nothing).
on:
  push:

permissions:
  contents: write # upload the build to the "preview-builds" pre-release

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # mise downloads tool releases from GitHub; the token avoids API rate limits. Nothing is deployed.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out with git (no actions/checkout)
        run: |
          git init -q .
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git log --oneline -1

      - name: mise install + mise run check + mise run e2e
        run: ci/check.sh
