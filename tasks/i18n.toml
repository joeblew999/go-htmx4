# tasks/i18n.toml — locales and UI messages.
#
#   mise run i18n:messages   # locales/*.toml (ICU MessageFormat) → typed accessors in locales/*_msg_gen.go
#   mise run i18n:generate   # kit/i18n/cldr (the shipped locales: names, direction, plural rules, digits) from CLDR
#
# Dates, times, currencies, units and the rest go through the runtime's own Intl, on the server and in the browser:
# kit/i18n/doc.go.

["i18n:messages"]
description = "Generate locales/*_msg_gen.go from the UI message catalogs locales/*.toml (I18N_LOCALES, en first)"
# Skipped when the catalogs, the generator and the locale list (mise.toml) are unchanged since the last run.
sources = ["locales/*.toml", "cmd/msggen/**/*.go", "kit/i18n/msggen/**/*.go", "mise.toml"]
outputs = ["locales/*_msg_gen.go"]
dir = "{{config_root}}"
run = "go run ./cmd/msggen -dir locales -out locales -locales \"$I18N_LOCALES\""

["i18n:generate"]
description = "Regenerate kit/i18n/cldr for I18N_LOCALES from CLDR, with the generator at the git tag i18n-generator (network on first run)"
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# The generator is the earlier server-side Intl and its CLDR tables (~160k lines), so it lives only at the tag
# i18n-generator: checked out beside the repo for this run, removed after.
root=$PWD tmp=$(mktemp -d)
trap 'git -C "$root" worktree remove --force "$tmp/gen" 2>/dev/null || true; rm -rf "$tmp"' EXIT
git rev-parse -q --verify i18n-generator >/dev/null || git fetch -q origin tag i18n-generator
git worktree add -q --detach "$tmp/gen" i18n-generator
cd "$tmp/gen/kit/i18n/legacy"
go run ./cmd/cldrgen -locales "$I18N_LOCALES" -out cldr
go run ./cmd/coregen -out "$root/kit/i18n/cldr/data_cldr.go" -golden "$root/kit/i18n/testdata/numbers.json"
'''
