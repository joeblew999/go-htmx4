# mise.toml — go-htmx4: Go + htmx 4 + gsxui on Cloudflare Workers (no Node anywhere)
#
#   mise install        # install pinned tools (Go itself comes from go.mod's toolchain line)
#   mise tasks          # every task; when to use which: docs/commands.md
#   mise run outdated   # every pin that's behind: these tools and go.mod's (gsx, structpages, …), which `mise upgrade` never reads
#   mise run update     # move them all (except what deps.toml holds), regenerate, then check and e2e (#177)

# The oldest mise that handles these pins (http: backend platforms, packslip tools). CI and Workers Builds install
# this version (charter's .github/workflows/charter.yml and .mise/tasks/charter-builds read it from here).
min_version = "2026.10.14"

[settings]
# go.mod/go.work `toolchain` is the Go pin; this makes `mise install` honour it.
idiomatic_version_file_enable_tools = ["go"]

[tools]
# gsx / gsxui toolchain. No Node anywhere.
# Tailwind standalone CLI — the npm-free path in https://ui.gsxhq.dev/docs/npm-free.
"github:tailwindlabs/tailwindcss" = "v4.3.5"
# gsxui has no tags yet: pin the commit (README: go install .../cmd/gsxui). `mise upgrade` can't check a commit pin
# ("no latest version found"); `mise run outdated` and `update` do (internal/deps).
"go:github.com/gsxhq/gsxui/cmd/gsxui" = "b9ffdfaa"
# gsx itself is pinned in go.mod: builds use `go tool gsx` (gsx Status guide); the editor copy comes from `gsx:editor` (tasks/gsx.toml).
# Cloudflare Workers toolchain. No Node, no wrangler.
# workerd: the standalone Workers runtime (what `wrangler dev` runs). Pin a release that has binaries.
workerd = "1.20261124.1"
# fnox: Cloudflare credentials from the keychain via `fnox exec -- …`.
fnox = "1.50.0"
# jq: task scripts read JSON with it (test:go's file list, vendor's npm metadata).
jq = "1.8.2"
# mise-intl and mise-seo: the languages and what search engines read. Their binaries here, their Go packages in go.mod at
# the same releases (mise run update moves both). Only those: the app has its own few tasks for them (tasks/app.toml),
# not the task files, workflows and hooks their init writes.
"github:joeblew999/mise-intl" = "0.1.16"
"github:joeblew999/mise-seo" = "0.0.2"
# usage: shell completion for task arguments and flags (mise run seo:inspect <TAB>, --json).
usage = "7.4.1"
# charter: the Worker's build, local workerd, deploys, CI and Workers Builds (charter.toml). Its library in go.mod is the
# same version: move both together, then charter init. TinyGo and wasm-opt are charter's, at the versions its TinyGo
# patch is for: .config/mise/conf.d/charter.toml, which charter init writes.
"github:joeblew999/charter" = "0.23.0"

# Chrome for `mise run e2e` (chromedp). Pinned so the Mac, CI and any other machine test the same browser; e2e gets
# its path from `mise which chrome-headless-shell`. Chrome for Testing: https://googlechromelabs.github.io/chrome-for-testing/
[tools."http:chrome-headless-shell"]
version = "155.0.8059.84"
[tools."http:chrome-headless-shell".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-headless-shell-linux64.zip", strip_components = 1, bin_path = "." }
macos-arm64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/mac-arm64/chrome-headless-shell-mac-arm64.zip", strip_components = 1, bin_path = "." }
macos-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/mac-x64/chrome-headless-shell-mac-x64.zip", strip_components = 1, bin_path = "." }

[env]
# The production wasm's compiler (ci/wasm-build.sh): "go", the standard compiler. It builds in seconds and takes any
# Go library as it is, and since charter 0.22 keeps its Go runtimes between requests, as TinyGo's build does (on a
# local workerd, 2026-11-25: / 2.3 ms against TinyGo's 1.8, /board 2.4 against 2.5; a runtime per request was 15).
# "tinygo" (a ~3x smaller wasm) was the default until then: it needs a patched runtime, a fork of structpages and an
# exact workers-go, and one ordinary library's new release (go-jose v4.1.8) took its wasm-opt step from 33 s to over
# 8 minutes at 5 to 6 GB (#188).
# Set WORKER_COMPILER in the environment to override it for one run: WORKER_COMPILER=tinygo mise run check
WORKER_COMPILER = "{{ get_env(name='WORKER_COMPILER', default='go') }}"
# Copies of charter.toml's facts for the tasks and scripts that still read them from the environment (TestCharterToml
# checks each): the Worker's name, its production custom domain ("" = workers.dev only; when set, *.workers.dev and
# plain http 301 to it: seo.Site, app/site.go) and its GitHub repository.
APP_NAME = "go-htmx4"
APP_DOMAIN = "go-htmx4.ubuntusoftware.net"
APP_REPO = "joeblew999/go-htmx4"
# The account's workers.dev subdomain: previews answer at https://<branch slug>-$APP_NAME.$CF_SUBDOMAIN.workers.dev
# (CI posts that URL on the PR). A copy of charter.toml's subdomain (TestCharterToml).
CF_SUBDOMAIN = "gedw99"

# The app's own tasks (tasks/), and charter's (.mise/tasks/charter.toml, which charter init writes).
[task_config]
includes = ["tasks/app.toml", "tasks/gsx.toml", ".mise/tasks/charter.toml", "tasks/upstream.toml"]

# The VS Code gsx language server needs the compiler where the extension looks (gsx:editor).
[hooks]
postinstall = { task = "gsx:editor" }

