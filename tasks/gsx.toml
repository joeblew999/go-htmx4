# tasks/gsx.toml — gsx and gsxui, as this app uses them. gsx is pinned in go.mod (`go tool gsx`), the gsxui CLI and
# Tailwind in mise.toml. The app's own tasks (tasks/app.toml) call these; none of them runs gsx or gsxui itself.
#
#   mise run gsx:generate        .gsx → .x.go: the app's, and intl's and seo's own components
#   mise run gsx:fmt [--check]   format every .gsx file (--check: fail on an unformatted one, writing nothing)
#   mise run gsx:editor          gsx's compiler for the VS Code language server (also after every mise install)
#   mise run gsxui:css           gsxui's CSS, compiled by the standalone Tailwind CLI (gsxui's npm-free mode)
#   mise run gsxui:theme <name>  switch the look to a gsxui theme

# gsx components (views/, ui/) → *.x.go, which are gitignored; every build/run/test path depends on this.
["gsx:generate"]
description = "go tool gsx generate (after intl: views write the generated messages); intl/'s and seo/'s own components too, which they commit for the apps that import them"
depends = ["intl"]
dir = "{{config_root}}"
run = ["go -C intl tool gsx generate -q .", "go -C seo tool gsx generate -q .", "go tool gsx generate"]

["gsx:fmt"]
description = "Format every .gsx file with gsx fmt; --check lists what isn't formatted and fails, writing nothing (test:go)"
dir = "{{config_root}}"
usage = 'flag "--check" help="fail on an unformatted file, writing nothing"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ "${usage_check:-false}" = true ]; then
  go tool gsx fmt -l . || { echo "✗ gsx fmt: run mise run gsx:fmt"; exit 1; }
else
  go tool gsx fmt -w .
fi
'''

# The VS Code gsx extension (recommended in .vscode/extensions.json) looks for the compiler on PATH, then GOBIN, then
# GOPATH/bin (gsx Editor support guide: https://github.com/gsxhq/gsx/blob/main/docs/guide/editor.md). VS Code's PATH
# rarely has this project's mise tools, and the extension checks candidates outside the repo, where mise shims don't
# resolve. So install into GOPATH/bin, at the gsx version go.mod pins (the one `go tool gsx` builds with). The
# extension still runs `go env GOPATH` to find it, so VS Code needs some `go` on its PATH. Upstream fix requested in
# https://github.com/gsxhq/vscode-gsx/issues/9.
# A shell that exports its own GOPATH (an agent, a CI job) may differ from the editor's, so when GOPATH differs from Go's
# default, install into both.
["gsx:editor"]
description = "Install go.mod's gsx into GOPATH/bin for the VS Code gsx language server"
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# CI has no editor (and compiling gsx costs ~10 s per run).
[ -z "${CI:-}" ] || { echo "· CI: no editor, skipping"; exit 0; }
bins=("$(go env GOPATH | cut -d: -f1)/bin")
default="$(env -u GOPATH go env GOPATH | cut -d: -f1)/bin"
[ "$default" = "${bins[0]}" ] || bins+=("$default")
for bin in "${bins[@]}"; do
  GOBIN="$bin" go install github.com/gsxhq/gsx/cmd/gsx
  echo "✓ $("$bin/gsx" version | head -1) → $bin/gsx"
done
echo "  VS Code: run \"gsx: Restart Language Server\""
'''

# gsxui's npm-free mode: web/gsxui/index.css (gsxui's own entry) compiled by the standalone Tailwind CLI.
["gsxui:css"]
description = "gsxui's CSS: web/gsxui/index.css compiled by the standalone Tailwind CLI into dist/gsxui.css"
dir = "{{config_root}}"
run = 'tailwindcss -i web/gsxui/index.css -o dist/gsxui.css --minify 2>&1 | grep -v "^≈\|^$" || true'

# The look is a gsxui theme (https://ui.gsxhq.dev/theming): gsxui.preset.json, applied by gsxui's own CLI, which
# rewrites the preset, web/gsxui/theme.css and, for another style, the components from gsxui's sources. A style's
# standard theme is the share code gsxui's theme editor (https://ui.gsxhq.dev/theme) gives when that style is picked;
# any other look is a code from the same editor. Nothing here styles anything.
["gsxui:theme"]
description = "Switch the app's look to a gsxui theme with gsxui apply: a style's standard theme by name (nova, gsxui's default and ours; vega, maia, lyra, mira, luma, sera, rhea), or any share code from gsxui's theme editor (https://ui.gsxhq.dev/theme). Then commit what it changed"
dir = "{{config_root}}"
usage = 'arg "<theme>" help="a style (nova, vega, maia, lyra, mira, luma, sera, rhea) or a gsxui:p1:… share code"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
case "$usage_theme" in
  nova) code=gsxui:p1:4GG ;; vega) code=gsxui:p1:4GI ;; maia) code=gsxui:p1:4GH ;; lyra) code=gsxui:p1:4GJ ;;
  mira) code=gsxui:p1:4GK ;; luma) code=gsxui:p1:4GL ;; sera) code=gsxui:p1:4GM ;; rhea) code=gsxui:p1:4GN ;;
  gsxui:*) code=$usage_theme ;;
  *) echo "✗ $usage_theme: a style (nova, vega, maia, lyra, mira, luma, sera, rhea) or a share code from https://ui.gsxhq.dev/theme"; exit 1 ;;
esac
gsxui apply --preset "$code" --yes
# A style's components may write text of their own: every message, in every language (mise run intl names any new one).
mise run intl
'''
