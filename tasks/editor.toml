# tasks/editor.toml — editor support.
#
#   mise run editor:gsx   # gsx compiler for the VS Code language server (also runs after every `mise install`)
#
# The VS Code gsx extension (recommended in .vscode/extensions.json) looks for the compiler on PATH, then GOBIN, then
# GOPATH/bin (gsx Editor support guide: https://github.com/gsxhq/gsx/blob/main/docs/guide/editor.md). VS Code's PATH
# rarely has this project's mise tools, and the extension checks candidates outside the repo, where mise shims don't
# resolve. So install into GOPATH/bin, at the gsx version go.mod pins (the one `go tool gsx` builds with). The
# extension still runs `go env GOPATH` to find it, so VS Code needs some `go` on its PATH. Upstream fix requested in
# https://github.com/gsxhq/vscode-gsx/issues/9 (plan: .plans/2026-09-15_0755_gsx-editor-language-server.md).

["editor:gsx"]
description = "Install go.mod's gsx into GOPATH/bin for the VS Code gsx language server"
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
bin="$(go env GOPATH | cut -d: -f1)/bin"
GOBIN="$bin" go install github.com/gsxhq/gsx/cmd/gsx
echo "✓ $("$bin/gsx" version | head -1) → $bin/gsx (run \"gsx: Restart Language Server\" in VS Code)"
'''
