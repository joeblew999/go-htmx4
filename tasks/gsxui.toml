# tasks/gsxui.toml — gsx + gsxui tasks (plan: .plans/done/2026-09-13_1109_adopt-gsxui.md)
#
# No Node anywhere. Tools come from mise.toml: go, tailwindcss (standalone), gsxui, gsx.
#
# upstream:gsxui:*  run gsxui's own demo (showcase site, component examples, theme editor)
#                   through its unbundled Go harness, jstest/harness. The steps mirror
#                   jstest/global-setup.ts, minus npx:
#
#   mise run upstream:gsxui:serve    # fetch + generate + deps + css, then serve
#                                    # → http://127.0.0.1:7799/

# ── upstream:gsxui:fetch ─────────────────────────────────────────────────────
["upstream:gsxui:fetch"]
description = "Check out gsxhq/gsxui at the pinned commit into .upstream/gsxui"
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
rev=c7fd6a82e7ce8b7fb03940fcb3de8da06b833340
dir=.upstream/gsxui
if [ ! -d "$dir/.git" ]; then
  mkdir -p "$dir"
  git -C "$dir" init -q
  git -C "$dir" remote add origin https://github.com/gsxhq/gsxui.git
fi
if [ "$(git -C "$dir" rev-parse -q --verify HEAD 2>/dev/null)" != "$rev" ]; then
  git -C "$dir" fetch -q --depth 1 origin "$rev"
  git -C "$dir" checkout -q --detach FETCH_HEAD
fi
echo "✓ gsxui @ $(git -C "$dir" log -1 --format='%h %cs %s')"
'''

# ── upstream:gsxui:generate ──────────────────────────────────────────────────
["upstream:gsxui:generate"]
description = "go tool gsx generate in the gsxui checkout"
depends = ["upstream:gsxui:fetch"]
dir = "{{config_root}}/.upstream/gsxui"
run = "go tool gsx generate"

# ── upstream:gsxui:test ──────────────────────────────────────────────────────
["upstream:gsxui:test"]
description = "gsxui's make test (generate + go vet + go test), Node-free"
depends = ["upstream:gsxui:generate", "upstream:gsxui:deps"]
dir = "{{config_root}}/.upstream/gsxui"
# internal/stylegen expects node_modules/.bin/tailwindcss; upstream:gsxui:deps links the
# standalone binary there. TestE2E* in internal/cli run `gsx init --yes`, whose Vite
# scaffold runs `npm install`, so they can't pass without Node and are skipped.
run = "go vet ./... && go test -skip '^TestE2E' ./..."

# ── upstream:gsxui:deps ──────────────────────────────────────────────────────
# The harness import map (jstest/harness/shell.go) and web/site.css resolve a few
# packages from node_modules/. Fetch those exact tarballs from the npm registry with
# curl, check them against package-lock.json's integrity hashes, and unpack them.
# No npm or node is involved.
["upstream:gsxui:deps"]
description = "Fetch the lock-pinned packages the harness needs into node_modules (curl, no npm)"
depends = ["upstream:gsxui:fetch"]
dir = "{{config_root}}/.upstream/gsxui"
run = '''
#!/usr/bin/env bash
set -euo pipefail
packages=(
  htmx.org css-tree mdn-data source-map-js jsonc-parser          # JS: harness import map
  tw-animate-css @fontsource-variable/geist @fontsource-variable/geist-mono   # CSS: web/site.css
)
for p in "${packages[@]}"; do
  entry=$(jq -ce --arg k "node_modules/$p" '.packages[$k]' package-lock.json) \
    || { echo "✗ $p not in package-lock.json"; exit 1; }
  version=$(jq -r .version <<<"$entry")
  url=$(jq -r .resolved <<<"$entry")
  integrity=$(jq -r .integrity <<<"$entry")
  dest="node_modules/$p"
  if [ -f "$dest/package.json" ] && [ "$(jq -r .version "$dest/package.json")" = "$version" ]; then
    echo "· $p@$version (cached)"; continue
  fi
  tgz=$(mktemp)
  curl -sfL -o "$tgz" "$url"
  algo=${integrity%%-*}; want=${integrity#*-}
  got=$(openssl dgst -"$algo" -binary "$tgz" | base64)
  [ "$got" = "$want" ] || { echo "✗ $p@$version integrity mismatch"; rm -f "$tgz"; exit 1; }
  rm -rf "$dest" && mkdir -p "$dest"
  tar -xzf "$tgz" -C "$dest" --strip-components 1
  rm -f "$tgz"
  echo "✓ $p@$version"
done
# Tests in internal/stylegen run node_modules/.bin/tailwindcss; the standalone CLI takes
# the same flags (gsxui npm-free guide).
mkdir -p node_modules/.bin
ln -sf "$(command -v tailwindcss)" node_modules/.bin/tailwindcss
echo "✓ node_modules/.bin/tailwindcss → $(readlink node_modules/.bin/tailwindcss)"
'''

# ── upstream:gsxui:css ───────────────────────────────────────────────────────
# global-setup.ts: compile jstest/full.css + jstest/foundation.css, then symlink the
# font files the compiled CSS references (Tailwind keeps the url()s relative to their
# source stylesheet).
["upstream:gsxui:css"]
description = "Compile the harness stylesheets with the standalone Tailwind CLI + link fonts"
depends = ["upstream:gsxui:deps", "upstream:gsxui:generate"]
dir = "{{config_root}}/.upstream/gsxui"
run = '''
#!/usr/bin/env bash
set -euo pipefail
tmp=jstest/.tmp
mkdir -p "$tmp/files"
go run ./jstest/harness -manifest "$tmp/examples.json"
tailwindcss -i jstest/full.css -o "$tmp/site.css"
tailwindcss -i jstest/foundation.css -o "$tmp/foundation.css"

missing=()
# @fontsource: url(./files/<name>) → node_modules/@fontsource-variable/*/files/<name>
for name in $(grep -oE 'url\(\./files/[^)"'"'"']+\)' "$tmp/site.css" | sed -E 's#url\(\./files/##; s#\)$##' | sort -u); do
  src=$(ls node_modules/@fontsource-variable/*/files/"$name" 2>/dev/null | head -1 || true)
  [ -n "$src" ] && ln -sf "$PWD/$src" "$tmp/files/$name" || missing+=("$name")
done
# gsxui's own fonts: url("./<name>.woff2") → assets/fonts/<name>.woff2
for name in $(grep -oE "url\([\"']?\./[^/)\"']+\.woff2[\"']?\)" "$tmp/site.css" | sed -E "s#url\([\"']?\./##; s#[\"']?\)\$##" | sort -u); do
  [ -f "assets/fonts/$name" ] && ln -sf "$PWD/assets/fonts/$name" "$tmp/$name" || missing+=("$name")
done
[ -z "${missing[*]:-}" ] || { echo "✗ unresolved font files: ${missing[*]}"; exit 1; }
echo "✓ $tmp/site.css $(wc -c <"$tmp/site.css" | tr -d ' ')B, foundation.css $(wc -c <"$tmp/foundation.css" | tr -d ' ')B, fonts linked"
'''

# ── upstream:gsxui:serve ─────────────────────────────────────────────────────
["upstream:gsxui:serve"]
description = "Serve gsxui's full demo via its Go harness → http://127.0.0.1:7799/"
depends = ["upstream:gsxui:css"]
dir = "{{config_root}}/.upstream/gsxui"
run = "go run ./jstest/harness -root ."

# ═════════════════════════════════════════════════════════════════════════════
# demo:gsxui:*  our own demo in demos/gsxui, built with the npm-free gsxui flow
#               (https://ui.gsxhq.dev/docs/npm-free) and the gsx CLI.
#
#   mise run demo:gsxui:dev      # css watch + gsx dev --no-web → printed URL
#   mise run demo:gsxui:run      # build, then run on http://localhost:7777
#   mise run demo:gsxui:test     # generate + vet + test
# ═════════════════════════════════════════════════════════════════════════════

["demo:gsxui:vendor"]
description = "Vendor htmx 4.0.0 + hx-live.js from the npm registry tarball (integrity-checked, no npm)"
dir = "{{config_root}}/demos/gsxui"
run = '''
#!/usr/bin/env bash
set -euo pipefail
version=4.0.0
if [ -f static/.htmx-version ] && [ "$(cat static/.htmx-version)" = "$version" ]; then
  echo "· htmx $version (cached)"; exit 0
fi
meta=$(curl -sfL "https://registry.npmjs.org/htmx.org/$version")
url=$(jq -r .dist.tarball <<<"$meta"); integrity=$(jq -r .dist.integrity <<<"$meta")
tgz=$(mktemp); curl -sfL -o "$tgz" "$url"
algo=${integrity%%-*}; want=${integrity#*-}
[ "$(openssl dgst -"$algo" -binary "$tgz" | base64)" = "$want" ] || { echo "✗ integrity mismatch"; exit 1; }
tmp=$(mktemp -d); tar -xzf "$tgz" -C "$tmp" --strip-components 1
mkdir -p static
cp "$tmp/dist/htmx.min.js" static/htmx.min.js
cp "$tmp/dist/ext/hx-live.js" static/hx-live.js
echo "$version" > static/.htmx-version
rm -rf "$tgz" "$tmp"
echo "✓ htmx $version: static/htmx.min.js, static/hx-live.js"
'''

["demo:gsxui:generate"]
description = "go tool gsx generate (demos/gsxui)"
dir = "{{config_root}}/demos/gsxui"
run = "go tool gsx generate"

["demo:gsxui:css"]
description = "Build dist/gsxui.css with the standalone Tailwind CLI"
dir = "{{config_root}}/demos/gsxui"
run = "tailwindcss -i web/gsxui/index.css -o dist/gsxui.css --minify"

["demo:gsxui:test"]
description = "gsx fmt check + generate + go vet + go test (demos/gsxui)"
depends = ["demo:gsxui:vendor", "demo:gsxui:generate", "demo:gsxui:css"]
dir = "{{config_root}}/demos/gsxui"
run = '''
#!/usr/bin/env bash
set -euo pipefail
go tool gsx fmt -l views || { echo "✗ gsx fmt: run 'go tool gsx fmt -w views'"; exit 1; }
test -z "$(gofmt -l main.go main_test.go views/*.go)" || { gofmt -l main.go main_test.go views/*.go; exit 1; }
go vet ./...
go test ./...
'''

["demo:gsxui:build"]
description = "css + generate + go build → demos/gsxui/bin/gsxui-demo"
depends = ["demo:gsxui:vendor", "demo:gsxui:generate", "demo:gsxui:css"]
dir = "{{config_root}}/demos/gsxui"
run = "go build -o bin/gsxui-demo ."

["demo:gsxui:run"]
description = "Build and run the demo → http://localhost:7777 (GO_PORT overrides)"
depends = ["demo:gsxui:build"]
dir = "{{config_root}}/demos/gsxui"
run = "./bin/gsxui-demo"

["demo:gsxui:dev"]
description = "Tailwind --watch + go tool gsx dev --no-web (regenerate, rebuild, restart on save) → http://localhost:7777"
depends = ["demo:gsxui:vendor", "demo:gsxui:css"]
dir = "{{config_root}}/demos/gsxui"
env = { GSXUI_DEV_PORT = "7777" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
tailwindcss -i web/gsxui/index.css -o dist/gsxui.css --watch=always &
css=$!
trap 'kill $css 2>/dev/null' EXIT
go tool gsx dev --no-web
'''

# ═════════════════════════════════════════════════════════════════════════════
# demo:gsxui:workers:*  the same demo on Cloudflare Workers: workers-go v0.35.0, TinyGo, no Node
#                       (plan: .plans/done/2026-09-13_1111_adopt-workers-go.md Phase 5).
#
#   mise run demo:gsxui:workers:serve   # TinyGo build + workerd → http://localhost:8918
#   mise run demo:gsxui:workers:smoke   # the same, plus curl checks
#   mise run demo:gsxui:workers:deploy  # smoke + deploy → https://go-htmx4-gsxui-demo.<subdomain>.workers.dev
#   mise run demo:gsxui:workers:smoke-remote
# ═════════════════════════════════════════════════════════════════════════════

# Static Assets with the native server's URL layout: /static = static/, /gsxui = web/gsxui/,
# /assets = dist/ + web/gsxui/fonts/ (fonts.css url()s are relative to the compiled CSS).
["demo:gsxui:workers:assets"]
description = "Assemble build/assets (Workers Static Assets) from static/, web/gsxui/, dist/ and fonts"
depends = ["demo:gsxui:vendor", "demo:gsxui:css"]
dir = "{{config_root}}/demos/gsxui"
run = '''
#!/usr/bin/env bash
set -euo pipefail
rm -rf build/assets
mkdir -p build/assets/static build/assets/gsxui build/assets/assets
cp static/*.js build/assets/static/
cp -R web/gsxui/. build/assets/gsxui/
cp dist/gsxui.css build/assets/assets/
cp web/gsxui/fonts/*.woff2 build/assets/assets/
echo "✓ build/assets: $(find build/assets -type f | wc -l | tr -d ' ') files, $(du -sh build/assets | cut -f1)"
'''

["demo:gsxui:workers:build"]
description = "gsx generate + TinyGo build → build/worker (fails if app.wasm gzip > 10 MB) + build/assets"
depends = ["demo:gsxui:generate", "demo:gsxui:workers:assets"]
dir = "{{config_root}}/demos/gsxui"
run = '''
#!/usr/bin/env bash
set -euo pipefail
go run github.com/syumai/workers-go/cmd/workers-assets-gen -mode=tinygo -o build/worker
tinygo build -o build/worker/app.wasm -target wasm -no-debug .
raw=$(wc -c <build/worker/app.wasm | tr -d ' ')
gz=$(gzip -9 -c build/worker/app.wasm | wc -c | tr -d ' ')
limit=10000000  # Workers Paid: 10 MB compressed
[ "$gz" -le "$limit" ] || { echo "✗ app.wasm gzip ${gz}B exceeds ${limit}B"; exit 1; }
echo "✓ build/worker/app.wasm raw=${raw}B gzip=${gz}B (limit ${limit}B)"
'''

["demo:gsxui:workers:serve"]
description = "TinyGo build, then workerd with static files first → http://localhost:8918"
depends = ["demo:gsxui:workers:build"]
dir = "{{config_root}}/demos/gsxui"
run = "exec workerd serve workers.capnp"

# go test runs on standard Go; this runs the real TinyGo build under workerd.
["demo:gsxui:workers:smoke"]
description = "Serve the TinyGo build on workerd (:8918) and curl pages, fragments, assets and route rules"
depends = ["demo:gsxui:workers:build"]
dir = "{{config_root}}/demos/gsxui"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# SMOKE_BASE=https://… runs the same checks against a deployed Worker (demo:gsxui:workers:smoke-remote).
base=${SMOKE_BASE:-}
touch build/workerd-smoke.log
if [ -z "$base" ]; then
  base=http://127.0.0.1:8918
  curl -s -o /dev/null "$base/" && { echo "✗ :8918 is already in use"; exit 1; }
  workerd serve workers.capnp >build/workerd-smoke.log 2>&1 &
  pid=$!
  trap 'kill $pid 2>/dev/null' EXIT
fi
echo "→ $base"
for _ in $(seq 1 120); do [ "$(curl -s "$base/healthz")" = ok ] && break; sleep 0.5; done
fail=0
check() { # name got want-substring
  if [[ "$2" == *"$3"* ]]; then echo "✓ $1"; else echo "✗ $1: got '${2:0:160}'"; fail=1; fi
}
code() { curl -s -o /dev/null -w '%{http_code} %{content_type}' "$@"; }
home=$(curl -s "$base/")
check "home page (gsx + gsxui)"         "$home" 'gsxui + htmx 4'
check "home: boost + morph inherited"   "$home" 'hx-boost:inherited="true"'
check "home: hx-live counter"           "$home" 'hx-on:click="data.count++"'
check "about page"                      "$(curl -s "$base/about")" 'About this demo'
check "POST /greet (escaped)"           "$(curl -s -X POST --data-urlencode 'name=Ada <b>' -d flavour=gsxui "$base/greet")" 'Ada &lt;b&gt;'
check "POST /greet empty"               "$(curl -s -X POST -d name= "$base/greet")" 'Please enter a name.'
check "DELETE /greet"                   "$(curl -s -X DELETE "$base/greet")" 'Cleared'
info=$(curl -s "$base/fragments/server-info")
check "server-info on TinyGo wasm"      "$info" 'tinygo 0.42.0 js/wasm'
check "server-info per-request note"    "$info" 'fresh Go runtime'
check "stats fragment"                  "$(curl -s "$base/fragments/stats")" '<ul'
check "asset /static/htmx.min.js"       "$(code "$base/static/htmx.min.js")" '200 text/javascript'
check "asset /static/hx-live.js"        "$(code "$base/static/hx-live.js")" '200 text/javascript'
check "asset /gsxui/index.js"           "$(code "$base/gsxui/index.js")" '200 text/javascript'
check "asset /assets/gsxui.css"         "$(code "$base/assets/gsxui.css")" '200 text/css'
check "asset font via /assets/"         "$(code "$base/assets/geist-latin-wght-normal.woff2")" '200 font/woff2'
check "405 GET /greet"                  "$(code "$base/greet")" '405'
check "404 unknown path"                "$(code "$base/nope")" '404'
if grep -qiE 'panic|uncaught' build/workerd-smoke.log; then echo "✗ errors in workerd log:"; cat build/workerd-smoke.log; fail=1; fi
exit $fail
'''

# Deploy with demos/workers/cmd/deploy (Direct Upload + script upload, no wrangler): Go-only layout
# (build/worker/worker.mjs is the entry), build/assets as Static Assets.
["demo:gsxui:workers:deploy"]
description = "Local workerd smoke + token check, then deploy → https://go-htmx4-gsxui-demo.<subdomain>.workers.dev"
depends = ["demo:gsxui:workers:smoke", "demo:workers:token-check"]
dir = "{{config_root}}/demos/workers"
run = '''
#!/usr/bin/env bash
set -euo pipefail
fnox exec -- go run ./cmd/deploy -name go-htmx4-gsxui-demo -allow-existing -main "" \
  -build ../gsxui/build/worker -assets ../gsxui/build/assets | tee ../gsxui/.deploy-url
'''

["demo:gsxui:workers:smoke-remote"]
description = "Run the workerd smoke checks against the deployed gsxui Worker (URL from .deploy-url)"
dir = "{{config_root}}/demos/gsxui"
run = '''
#!/usr/bin/env bash
set -euo pipefail
url=$(cat .deploy-url 2>/dev/null) || { echo "✗ no .deploy-url; run demo:gsxui:workers:deploy"; exit 1; }
SMOKE_BASE="$url" mise run demo:gsxui:workers:smoke
'''

# The gsx CLI's dev loop for the Workers build: gsx dev regenerates on save, rebuilds the TinyGo worker +
# assets and restarts workerd (:8918). One gsx.toml serves both loops via GSXUI_DEV_PORT.
["demo:gsxui:workers:dev"]
description = "go tool gsx dev on Workers: save .gsx/.go → regenerate → TinyGo + assets → workerd restart → http://localhost:8918"
dir = "{{config_root}}/demos/gsxui"
env = { GSXUI_DEV_PORT = "8918" }
run = "go tool gsx dev --no-web -build 'mise run demo:gsxui:workers:build' -run 'workerd serve workers.capnp'"
