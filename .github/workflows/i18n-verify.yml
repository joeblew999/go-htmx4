# kit/i18n reference data (kit/i18n/README.md): proves the committed CLDR tables, Intl goldens and known-difference
# evidence come from the pinned sources, and flags a newer workerd release with a different Chromium ICU. Weekly, on
# demand, and on pull requests that touch the i18n generator, cases or pins.
# Strict no-Node: shell `run:` steps only, no JavaScript actions (like check.yml).
name: i18n-verify

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "kit/i18n/cldrgen/**"
      - "kit/i18n/intltest/**"
      - "kit/i18n/cldr/**"
      - "kit/i18n/testdata/**"
      - "kit/i18n/conformance_test.go"
      - "cmd/cldrgen/**"
      - "cmd/intloracle/**"
      - "cmd/i18npins/**"
      - "mise.toml"
      - "tasks/i18n.toml"

permissions:
  contents: read

concurrency:
  group: i18n-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # mise downloads tool releases from GitHub, and i18npins -latest reads the workerd releases API: the token avoids
      # rate limits. Nothing is deployed.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out with git (no actions/checkout)
        run: |
          git init -q .
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git log --oneline -1

      - name: mise run i18n:verify + newest workerd ICU + browser drift
        run: ci/i18n-verify.sh
