# tasks/app.toml — the app's tasks (plans: .plans/done/2026-09-13_1111_adopt-workers-go.md and later).
#
# workers-go v0.35.0, TinyGo for everything that ships to Workers, no Node (no npm, no wrangler). Standard Go
# only for local-only code: `go run .`, go test/vet, cmd/deploy, cmd/wsload. Tools come from mise.toml.
#
#   mise run dev            # gsx dev: save → regenerate → TinyGo + assets → workerd restart → http://localhost:8913
#   mise run serve          # TinyGo build + workerd (static files first)                  → http://localhost:8913
#   mise run run            # go run . (non-js fallback)                                  → http://localhost:9913
#   mise run test           # TinyGo build (size-gated) + workerd smoke + gsx fmt/gofmt + vet + go test
#   mise run load           # 1,000 WebSockets on one topic + 50-write burst (local, or LOAD_BASE=…)
#   mise run deploy         # test + token check, then Direct Upload → https://$APP_NAME.<subdomain>.workers.dev
#   mise run smoke-remote   # curl every route of the deployed Worker

# Vendor htmx 4.0.0 + the hx-ws extension from the npm registry tarball (integrity-checked,
# no npm), same approach as demo:gsxui:vendor.
["vendor"]
description = "Vendor htmx 4.0.0 htmx.min.js + ext/hx-ws.js into static/ (curl, integrity-checked)"
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
version=4.0.0
if [ -f static/hx-ws.js ] && [ "$(cat static/.htmx-version 2>/dev/null)" = "$version" ]; then
  echo "· htmx $version (cached)"; exit 0
fi
meta=$(curl -sfL "https://registry.npmjs.org/htmx.org/$version")
url=$(jq -r .dist.tarball <<<"$meta"); integrity=$(jq -r .dist.integrity <<<"$meta")
tgz=$(mktemp); curl -sfL -o "$tgz" "$url"
algo=${integrity%%-*}; want=${integrity#*-}
[ "$(openssl dgst -"$algo" -binary "$tgz" | base64)" = "$want" ] || { echo "✗ integrity mismatch"; exit 1; }
tmp=$(mktemp -d); tar -xzf "$tgz" -C "$tmp" --strip-components 1
cp "$tmp/dist/htmx.min.js" static/htmx.min.js
cp "$tmp/dist/ext/hx-ws.js" static/hx-ws.js
echo "$version" > static/.htmx-version
rm -rf "$tgz" "$tmp"
echo "✓ htmx $version: static/htmx.min.js, static/hx-ws.js"
'''

# gsx components (views/, ui/) → *.x.go, which are gitignored; every build/run/test path depends on this.
["generate"]
description = "go tool gsx generate"
dir = "{{config_root}}"
# Explicit dirs: gsx generate/fmt walk into nested modules (demos/gsxui) with this module's gsx.toml (gsx v0.1.0).
run = "go tool gsx generate views ui"

# gsxui (npm-free mode): compile web/gsxui/index.css with the standalone Tailwind CLI, then assemble the
# Static Assets directory: /static/ = static/ (htmx, hx-ws),
# /gsxui/ = web/gsxui/ behaviours, /assets/ = compiled CSS + fonts (fonts.css url()s are relative).
["assets"]
description = "Tailwind (gsxui CSS) + assemble dist/site (Static Assets for workerd, go run . and deploy)"
depends = ["vendor"]
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
tailwindcss -i web/gsxui/index.css -o dist/gsxui.css --minify 2>&1 | grep -v "^≈\|^$" || true
rm -rf dist/site
mkdir -p dist/site/static dist/site/gsxui dist/site/assets
cp static/*.js dist/site/static/
cp -R web/gsxui/. dist/site/gsxui/
cp dist/gsxui.css dist/site/assets/
cp web/gsxui/fonts/*.woff2 dist/site/assets/
echo "✓ dist/site: $(find dist/site -type f | wc -l | tr -d ' ') files, gsxui.css $(wc -c <dist/site/assets/gsxui.css | tr -d ' ')B"
'''

["build"]
depends = ["vendor", "generate", "assets"]
description = "TinyGo build → build/ (fails if app.wasm gzip > 10 MB, Workers Paid)"
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
go run github.com/syumai/workers-go/cmd/workers-assets-gen -mode=tinygo
# `.`, not the template's `./...`: keep local-only tools under cmd/ out of the wasm.
tinygo build -o build/app.wasm -target wasm -no-debug .
raw=$(wc -c <build/app.wasm | tr -d ' ')
gz=$(gzip -9 -c build/app.wasm | wc -c | tr -d ' ')
limit=10000000  # Workers Paid (account checked 2026-09-13): 10 MB compressed; free plan is 3 MB
[ "$gz" -le "$limit" ] || { echo "✗ app.wasm gzip ${gz}B exceeds ${limit}B"; exit 1; }
echo "✓ build/app.wasm raw=${raw}B gzip=${gz}B (limit ${limit}B)"
'''

# The gsx CLI's dev loop on Workers: gsx.toml [dev] builds the TinyGo worker + gsxui CSS and runs workerd.
["dev"]
description = "go tool gsx dev: save .gsx/.go → regenerate → TinyGo + CSS → workerd restart → http://localhost:8913"
dir = "{{config_root}}"
run = "go tool gsx dev --no-web"

["run"]
description = "go run . (non-js fallback, dist/site served by Go) → http://localhost:9913"
depends = ["generate", "assets"]
dir = "{{config_root}}"
env = { PORT = "9913", APP_ENV = "go run . (local)" }
run = "go run ."

["serve"]
description = "TinyGo build, then workerd with static files first → http://localhost:8913"
depends = ["build"]
dir = "{{config_root}}"
run = "mkdir -p .workerd-state && exec workerd serve workerd/config.capnp"

# go test runs the handlers on standard Go, which hides TinyGo runtime gaps (html/template
# panics, pre-1.22 ServeMux). So also run the real TinyGo wasm under workerd and curl it.
["smoke"]
description = "Serve the TinyGo build on workerd (:8913) and curl every route"
depends = ["build"]
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
base=http://127.0.0.1:8913
curl -s -o /dev/null "$base/" && { echo "✗ :8913 is already in use"; exit 1; }
mkdir -p .workerd-state
workerd serve workerd/config.capnp >build/workerd-smoke.log 2>&1 &
pid=$!
# workerd can ignore SIGTERM while it drains (seen with hibernated WebSockets): escalate so :8913 is freed.
stop() { kill "$pid" 2>/dev/null || return 0; for _ in $(seq 1 30); do kill -0 "$pid" 2>/dev/null || return 0; sleep 0.1; done; kill -9 "$pid" 2>/dev/null || true; }
trap stop EXIT
for _ in $(seq 1 80); do [ "$(curl -s "$base/healthz")" = ok ] && break; sleep 0.25; done
fail=0
check() { # name got want-substring
  if [[ "$2" == *"$3"* ]]; then echo "✓ $1"; else echo "✗ $1: got '${2:0:160}'"; fail=1; fi
}
page=$(curl -s "$base/")
check "page runs on TinyGo wasm"  "$page" '<span id="target">tinygo js/wasm</span>'
check "text binding APP_ENV"      "$page" '<span id="env">workerd (local)</span>'
check "GET fragment"              "$(curl -s "$base/fragments/now")" '<time datetime='
check "POST form, escaped"        "$(curl -s -X POST --data-urlencode 'name=<b>Ada' "$base/greet")" 'Hello, &lt;b&gt;Ada.'
check "state resets per request"  "$(curl -s -X POST "$base/count")$(curl -s -X POST "$base/count")" '11'
check "static file first"         "$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$base/static/htmx.min.js")" '200 text/javascript'
check "gsxui css asset"           "$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$base/assets/gsxui.css")" '200 text/css'
check "gsxui behaviours module"   "$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$base/gsxui/index.js")" '200 text/javascript'
check "gsxui font asset"          "$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$base/assets/geist-latin-wght-normal.woff2")" '200 font/woff2'
check "theme toggle in header"    "$(curl -s "$base/")" 'data-site-theme-toggle'
check "405 on wrong method"       "$(curl -s -o /dev/null -w '%{http_code}' "$base/greet")" '405'
check "404 for missing file"      "$(curl -s -o /dev/null -w '%{http_code}' "$base/nope.txt")" '404'
# Shared board: Go (TinyGo) → database/sql d1 driver → LocalD1 → publish → Room DO → hx-ws.
check "board page with hx-ws"     "$(curl -s "$base/board?topic=smoke")" 'hx-ws:connect="/live/smoke"'
check "board write via D1 driver" "$(curl -s -X POST -d delta=1 "$base/board/add?topic=smoke")" 'hx-swap-oob="true" data-version="'
check "hx-ws.js from static/"     "$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$base/static/hx-ws.js")" '200 text/javascript'
check "/live needs an upgrade"    "$(curl -s -o /dev/null -w '%{http_code}' "$base/live/smoke")" '426'
if go run ./cmd/wsload -n 2 -topic smoke >build/wsload-smoke.log 2>&1; then
  echo "✓ live push to 2 WebSockets + cached fragment (wsload)"
else
  echo "✗ wsload:"; cat build/wsload-smoke.log; fail=1
fi
if grep -qiE 'panic|uncaught' build/workerd-smoke.log; then echo "✗ errors in workerd log:"; cat build/workerd-smoke.log; fail=1; fi
exit $fail
'''

# Design size: 1,000 WebSockets on one topic, then a burst of 50 concurrent writes (coalescing).
# Starts its own workerd on :8913 unless LOAD_BASE points somewhere else (e.g. the deployed URL).
["load"]
description = "1,000 WebSockets on one topic + a 50-write burst (local workerd, or LOAD_BASE=https://…)"
depends = ["build"]
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
ulimit -n 8192
base=${LOAD_BASE:-}
if [ -z "$base" ]; then
  base=http://127.0.0.1:8913
  curl -s -o /dev/null "$base/" && { echo "✗ :8913 is already in use"; exit 1; }
  mkdir -p .workerd-state
  workerd serve workerd/config.capnp >build/workerd-load.log 2>&1 &
  pid=$!
  stop() { kill "$pid" 2>/dev/null || return 0; for _ in $(seq 1 30); do kill -0 "$pid" 2>/dev/null || return 0; sleep 0.1; done; kill -9 "$pid" 2>/dev/null || true; }
  trap stop EXIT
  for _ in $(seq 1 80); do [ "$(curl -s "$base/healthz")" = ok ] && break; sleep 0.25; done
fi
echo "→ $base"
go run ./cmd/wsload -base "$base" -n 1000 -topic load
go run ./cmd/wsload -base "$base" -n 1000 -writes 50 -topic load-burst
'''

["test"]
description = "TinyGo build + workerd smoke test + gsx fmt/gofmt check + go vet + go test"
depends = ["smoke"]
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
go tool gsx fmt -l views ui || { echo "✗ gsx fmt: run 'go tool gsx fmt -w views ui'"; exit 1; }
# Files of this module only (gofmt -l on a directory recurses into demos/ and .upstream/); IgnoredGoFiles
# are the other platform's build-tagged files.
unformatted=$(gofmt -l $(go list -json ./... | jq -r '.Dir as $d | (.GoFiles + (.TestGoFiles // []) + (.XTestGoFiles // []) + (.IgnoredGoFiles // []))[] | "\($d)/\(.)"'))
test -z "$unformatted" || { echo "$unformatted"; echo "✗ gofmt: files need formatting"; exit 1; }
go vet ./...
go test ./...
'''

# ── token-check ─────────────────────────────────────────────────
# Credentials come from fnox via mise (global keychain config). The inner sh -c '…' is
# single-quoted so $CLOUDFLARE_API_TOKEN expands after fnox has injected it.
["token-check"]
description = "Verify CLOUDFLARE_API_TOKEN (from fnox) against the Cloudflare API"
run = '''
fnox exec -- sh -c '
  [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "✗ CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID missing from fnox"; exit 1; }
  curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify \
    | jq -e ".success and .result.status == \"active\"" >/dev/null \
    && echo "✓ token active" || { echo "✗ token invalid or not active"; exit 1; }
'
'''

# ── deploy ──────────────────────────────────────────────────────
# Direct Upload via cmd/deploy (stdlib Go, no wrangler). Runs the full local test
# (TinyGo build + workerd smoke + go test) and the token check first. The Worker and D1 names are
# $APP_NAME (mise.toml [env]); updating an existing script of that name is allowed.
["deploy"]
description = "Test, then deploy → https://$APP_NAME.<subdomain>.workers.dev"
depends = ["test", "token-check"]
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
fnox exec -- go run ./cmd/deploy -name "$APP_NAME" -allow-existing \
  -main worker/index.mjs -module worker/room.mjs -assets dist/site \
  -var "APP_ENV=cloudflare (workers.dev)" \
  -d1 DB="$APP_NAME" -d1-create -migrations migrations \
  -do ROOM=Room -migration-tag v1 -new-sqlite-class Room \
  | tee .deploy-url   # outside build/: workers-assets-gen wipes build/ on every build
'''

# ── smoke-remote ────────────────────────────────────────────────
# Same checks as smoke, against the deployed URL (from .deploy-url, written by deploy).
["smoke-remote"]
description = "curl every route of the deployed Worker"
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
base=$(cat .deploy-url 2>/dev/null) || { echo "✗ no .deploy-url; run deploy"; exit 1; }
echo "→ $base"
# A brand-new workers.dev hostname can take a little while to answer.
for _ in $(seq 1 60); do [ "$(curl -s "$base/healthz")" = ok ] && break; sleep 2; done
fail=0
check() { # name got want-substring
  if [[ "$2" == *"$3"* ]]; then echo "✓ $1"; else echo "✗ $1: got '${2:0:160}'"; fail=1; fi
}
page=$(curl -s "$base/")
check "page runs on TinyGo wasm"  "$page" '<span id="target">tinygo js/wasm</span>'
check "plain_text binding"        "$page" '<span id="env">cloudflare (workers.dev)</span>'
check "GET fragment"              "$(curl -s "$base/fragments/now")" '<time datetime='
check "POST form, escaped"        "$(curl -s -X POST --data-urlencode 'name=<b>Ada' "$base/greet")" 'Hello, &lt;b&gt;Ada.'
check "state resets per request"  "$(curl -s -X POST "$base/count")$(curl -s -X POST "$base/count")" '11'
check "static asset htmx"         "$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$base/static/htmx.min.js")" '200 '
check "static asset css"          "$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$base/assets/gsxui.css")" '200 text/css'
check "gsxui behaviours module"   "$(curl -s -o /dev/null -w '%{http_code}' "$base/gsxui/index.js")" '200'
check "theme toggle in header"    "$(curl -s "$base/")" 'data-site-theme-toggle'
check "405 on wrong method"       "$(curl -s -o /dev/null -w '%{http_code}' "$base/greet")" '405'
check "404 for missing file"      "$(curl -s -o /dev/null -w '%{http_code}' "$base/nope.txt")" '404'
# Shared board: Go → D1 → Room DO → hx-ws.
check "board page with hx-ws"     "$(curl -s "$base/board?topic=smoke")" 'hx-ws:connect="/live/smoke"'
check "board write via D1"        "$(curl -s -X POST -d delta=1 "$base/board/add?topic=smoke")" 'hx-swap-oob="true" data-version="'
check "hx-ws.js asset"            "$(curl -s -o /dev/null -w '%{http_code}' "$base/static/hx-ws.js")" '200'
check "/live needs an upgrade"    "$(curl -s -o /dev/null -w '%{http_code}' "$base/live/smoke")" '426'
if go run ./cmd/wsload -base "$base" -n 2 -topic smoke; then
  echo "✓ live push to 2 WebSockets + cached fragment (wsload)"
else
  echo "✗ wsload"; fail=1
fi
exit $fail
'''
