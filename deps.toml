# What mise run update leaves where it is, and why (#169); mise run outdated shows them, held. A name is a Go module, a
# mise tool as mise.toml names it, an npm package, or "htmx"; one ending in * holds every name that starts so.
[hold]
"@moq/*" = "Cloudflare's MoQ relays speak drafts 14 and 16; @moq's next releases speak only draft-18, which they don't yet (#158)"
"github.com/syumai/workers-go" = "v0.36.0 is what charter's Worker glue is written for"

# A pin's copies outside mise.toml: files that write the version too, as a quoted string. mise run update moves them
# with the pin.
[copies]
