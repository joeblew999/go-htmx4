class_merger = "github.com/joeblew999/go-htmx4/ui/merge.Merge"

# gsx config for the app (gsx Configuration guide).
# gsx's htmx preset predates htmx 4: add hx-action, and hx-ws:connect, which also carries a URL.
url_presets = ["htmx"]

[url_attrs]
names = ["hx-action", "hx-ws:connect"]

# gsx dev (gsx Configuration guide, [dev]): a .gsx/.go save regenerates, rebuilds, restarts the backend and probes
# /healthz. Two loops share this config; the backend port comes from APP_DEV_PORT (gsx then leaves ports to us):
#   mise run dev          build/run below: TinyGo worker + gsxui CSS → workerd on :8913 (Durable Objects, D1 shim, pushes)
#   mise run dev:native   -build/-run flags: go build → the native server on :9913 (seconds per save, no live push)
[dev]
no_web = true
build = ["mise", "run", "build"]
run = ["sh", "-c", "mkdir -p .workerd-state && exec workerd serve workerd/config.capnp"]
upstream = "http://127.0.0.1:${APP_DEV_PORT}"
health = "/healthz"
