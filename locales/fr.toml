# Below the board: how it works, a heading and five steps.
how_title = "Comment fonctionne le tableau"
how_write = "Chaque modification est un envoi de formulaire à un gestionnaire Go sur le Worker. Il écrit dans D1, la base de données SQLite de Cloudflare et seule source de vérité du tableau, puis augmente la version du sujet."
how_push = "Le gestionnaire produit ensuite le rendu complet du tableau, une fois par langue, et le confie au Durable Object du sujet, qui l’envoie à chaque onglet ouvert. Rien n’est fusionné dans le navigateur : chaque push remplace le tableau."
how_sockets = "Les onglets restent connectés grâce au hx-ws de htmx 4 via WebSocket Hibernation, si bien qu’un millier d’onglets inactifs ne coûte presque rien tant que rien ne change. Le badge indique qui est là."
how_order = "Chaque push porte la version dont il est issu. Un onglet ignore tout push plus ancien que le tableau qu’il affiche : même si des modifications se croisent sur le réseau, il ne revient jamais en arrière."
how_limits = "Chaque connexion peut effectuer 60 modifications en 10 secondes, et un sujet accepte jusqu’à 1 000 onglets ouverts."

