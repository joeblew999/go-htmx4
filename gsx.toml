class_merger = "github.com/joeblew999/go-htmx4/internal/classmerge.Merge"

# gsx config for the app (gsx Configuration guide).
# gsx's htmx preset knows hx-action; add htmx 4's hx-ws:connect, which also carries a URL.
url_presets = ["htmx"]
# intl as gsx filters: { t |> date(opts) }, { n |> number }, { t |> since }, title={ m |> text }.
filter_packages = ["github.com/joeblew999/charter/gsxintl/filters"]

# gsxui components write their own text ("Close", "Notifications") as ui/i18n.T; translate it from the catalogs.
[renderers]
"github.com/joeblew999/go-htmx4/ui/i18n.T" = "github.com/joeblew999/go-htmx4/ui/i18n.Translate"
# intl: an Intl call or a translated message written in markup renders in the request's language.
"github.com/joeblew999/charter/intl.Value" = "github.com/joeblew999/charter/gsxintl.Render"
"github.com/joeblew999/charter/intl.Msg" = "github.com/joeblew999/charter/intl.Translate"
"github.com/joeblew999/charter/intl.Plain" = "github.com/joeblew999/charter/intl.PlainText"

# A page's link is its route in structpages' tree (views.Pages), in the request's language: { About{} |> url }.
# Named filters win over filter_packages (intl's url takes a page with a Path; ours read the tree). id and target are
# structpages' own: an element id for a page's component, and the htmx target selector for it.
[filters]
url = "github.com/joeblew999/go-htmx4/views/link.URL"
id = "github.com/jackielii/structpages.ID"
target = "github.com/jackielii/structpages.IDTarget"

[url_attrs]
names = ["hx-ws:connect"]

# gsx's lints (gsx's Configuration guide, "Lints"), as errors: gsx generate, which every build, test and CI run calls,
# fails on one instead of printing a warning nobody reads. go tool gsx info lists them and their levels.
[lint]
duplicate-attribute = "error"
punctuation-space = "error"
redundant-space-literal = "error"
self-reference-leaf = "error"
url-always-blocked = "error"
wrapper-cycle = "error"
