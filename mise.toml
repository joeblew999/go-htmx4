# mise.toml — go-htmx4: Go + htmx 4 + gsxui on Cloudflare Workers (no Node anywhere)
#
#   mise install        # install pinned tools (Go itself comes from go.mod's toolchain line)
#   mise tasks          # every task; when to use which: docs/commands.md

# The oldest mise that handles these pins (http: backend platforms, packslip tools). CI and Workers Builds install
# this version (ci/check.sh, ci/workers-builds.sh read it from here).
min_version = "2026.10.14"

[settings]
# go.mod/go.work `toolchain` is the Go pin; this makes `mise install` honour it.
idiomatic_version_file_enable_tools = ["go"]

[tools]
tinygo = "0.43.0"      # workers-go TinyGo builds need >= 0.42.0 (net/http on wasm); supports Go <= 1.27
# wasm-opt, required by `tinygo build -target wasm`. The aqua registry lags (121),
# so pull the upstream release directly.
"github:WebAssembly/binaryen" = "version_133"
# gsx / gsxui toolchain. No Node anywhere.
# Tailwind standalone CLI — the npm-free path in https://ui.gsxhq.dev/docs/npm-free.
"github:tailwindlabs/tailwindcss" = "v4.3.3"
# gsxui has no tags yet: pin the commit (README: go install .../cmd/gsxui).
"go:github.com/gsxhq/gsxui/cmd/gsxui" = "915241b"
# gsx itself is pinned in go.mod: builds use `go tool gsx` (gsx Status guide); the editor copy comes from `editor:gsx`.
# Cloudflare Workers toolchain. No Node, no wrangler.
# workerd: the standalone Workers runtime (what `wrangler dev` runs). Pin a release that has binaries.
workerd = "1.20261019.1"
# fnox: Cloudflare credentials from the keychain via `fnox exec -- …`.
fnox = "1.40.0"
# jq: task scripts read JSON with it (test:go's file list, vendor's npm metadata).
jq = "1.8.2"
# usage: shell completion for task arguments and flags (mise run seo:inspect <TAB>, --json).
usage = "7.0.2"

# Chrome for `mise run e2e` (chromedp). Pinned so the Mac, CI and any other machine test the same browser; e2e gets
# its path from `mise which chrome-headless-shell`. Chrome for Testing: https://googlechromelabs.github.io/chrome-for-testing/
[tools."http:chrome-headless-shell"]
version = "155.0.8059.84"
[tools."http:chrome-headless-shell".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-headless-shell-linux64.zip", strip_components = 1, bin_path = "." }
macos-arm64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/mac-arm64/chrome-headless-shell-mac-arm64.zip", strip_components = 1, bin_path = "." }
macos-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/mac-x64/chrome-headless-shell-mac-x64.zip", strip_components = 1, bin_path = "." }

[env]
# The production wasm's compiler (ci/wasm-build.sh): "tinygo" (charter's go tool workerbuild: the smallest wasm, Go
# runtimes kept between requests; a new build takes minutes, an unchanged one comes from charter's cache) or "go" (the
# standard compiler: seconds, a ~3x bigger wasm and a runtime per request, ~50–90 ms slower at the median on Workers,
# measured 2026-10-20). Users pay that, so: tinygo. mise run dev always uses go.
# Set WORKER_COMPILER in the environment to override it for one run: WORKER_COMPILER=go ci/check.sh
WORKER_COMPILER = "{{ get_env(name='WORKER_COMPILER', default='tinygo') }}"
# Worker script and D1 database name (mise run deploy): https://$APP_NAME.<subdomain>.workers.dev
APP_NAME = "go-htmx4"
# Custom domain (Workers Custom Domain, zone in the same Cloudflare account); "" = workers.dev only. When set, deploy
# attaches it, and *.workers.dev and plain http 301 to it (seo.Site, app/site.go). mise run rename clears it.
APP_DOMAIN = "go-htmx4.ubuntusoftware.net"
# GitHub repository (owner/name) for preview builds and Workers Builds; mise run rename sets it from the module path.
APP_REPO = "joeblew999/go-htmx4"
# The account's workers.dev subdomain: previews answer at https://<branch slug>-$APP_NAME.$CF_SUBDOMAIN.workers.dev
# (CI posts that URL on the PR). The owner's; mise run rename clears it.
CF_SUBDOMAIN = "gedw99"

[task_config]
includes = ["tasks/app.toml", "intl/mise/tasks.toml", "seo/mise/tasks.toml", "tasks/editor.toml"]

# The VS Code gsx language server needs the compiler where the extension looks (tasks/editor.toml).
[hooks]
postinstall = { task = "editor:gsx" }

