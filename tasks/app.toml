# tasks/app.toml — the app's tasks: build, dev loops, tests, deploys, release. Every task, with when to use it:
# docs/commands.md (generated from the descriptions: mise run docs:commands).
#
# TinyGo (or WORKER_COMPILER) for what ships to Workers; standard Go for local-only code: go test/vet,
# charter deploy and tail, e2e/. No Node. Tools come from mise.toml.

# Vendor htmx 4.0.2 + the hx-ws and hx-live extensions from the npm registry tarball (integrity-checked,
# no npm).
["vendor"]
description = "Vendor htmx 4.0.2 htmx.min.js + ext/hx-ws.js + ext/hx-live.js into web/htmx/ (curl, integrity-checked)"
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
version=4.0.2
if [ -f web/htmx/hx-ws.js ] && [ -f web/htmx/hx-live.js ] && [ "$(cat web/htmx/.htmx-version 2>/dev/null)" = "$version" ]; then
  echo "· htmx $version (cached)"; exit 0
fi
meta=$(curl -sfL "https://registry.npmjs.org/htmx.org/$version")
url=$(jq -r .dist.tarball <<<"$meta"); integrity=$(jq -r .dist.integrity <<<"$meta")
tgz=$(mktemp); curl -sfL -o "$tgz" "$url"
algo=${integrity%%-*}; want=${integrity#*-}
[ "$(openssl dgst -"$algo" -binary "$tgz" | base64)" = "$want" ] || { echo "✗ integrity mismatch"; exit 1; }
tmp=$(mktemp -d); tar -xzf "$tgz" -C "$tmp" --strip-components 1
cp "$tmp/dist/htmx.min.js" web/htmx/htmx.min.js
cp "$tmp/dist/ext/hx-ws.js" web/htmx/hx-ws.js
cp "$tmp/dist/ext/hx-live.js" web/htmx/hx-live.js
echo "$version" > web/htmx/.htmx-version
rm -rf "$tgz" "$tmp"
echo "✓ htmx $version: web/htmx/htmx.min.js, web/htmx/hx-ws.js, web/htmx/hx-live.js"
'''

# The map's and the live video's browser files (#164): each component's glue (views/blocks/js/<component>/<component>.mjs)
# and the npm packages its npm-lock.json pins, bundled by internal/jsbundle (npm's registry over HTTP, esbuild's Go
# API: no Node) into web/blocks, served at /blocks/. Skipped when none of its inputs changed; the bundles are committed,
# like htmx. @moq stays at what Cloudflare's relays speak until they ship draft-18 (#158).
["js:bundle"]
description = "Bundle the map's Leaflet and the live video's @moq elements, each with its glue, from the npm packages each npm-lock.json pins, into web/blocks (no Node)"
dir = "{{config_root}}"
sources = ["views/blocks/js/**/*", "internal/jsbundle/*.go"]
outputs = ["web/blocks/map.js", "web/blocks/map.css", "web/blocks/moq.js"]
run = [
  "go run ./internal/jsbundle -entry views/blocks/js/map/map.mjs -out web/blocks/map.js -lock views/blocks/js/map/npm-lock.json -external /gsxui/gsxui.js",
  "go run ./internal/jsbundle -entry views/blocks/js/moq/moq.mjs -out web/blocks/moq.js -lock views/blocks/js/moq/npm-lock.json -patches views/blocks/js/moq/npm-patches.json -external /gsxui/gsxui.js",
]

["js:update"]
description = "Re-resolve a component's npm packages (e.g. mise run js:update moq @moq/watch@0.6.6 @moq/publish@0.5.3, or map leaflet@1.9.4), rewrite its npm-lock.json and bundle; @moq stays at a version Cloudflare's relays speak until they ship draft-18 (#158)"
dir = "{{config_root}}"
usage = '''
arg "<component>" help="map or moq"
arg "<packages>" var=#true help="name@version of each package to resolve"
'''
run = 'go run ./internal/jsbundle -entry views/blocks/js/${usage_component}/${usage_component}.mjs -out web/blocks/${usage_component}.js -lock views/blocks/js/${usage_component}/npm-lock.json $(test -f views/blocks/js/${usage_component}/npm-patches.json && echo -patches views/blocks/js/${usage_component}/npm-patches.json) -external /gsxui/gsxui.js -update ${usage_packages}'

# Every pin against upstream, and moving them all (#169): internal/deps, with deps.toml's holds. update moves gsx, gsxui
# and structpages first, then every other pin, tidies every module, writes everything generated
# from them again, and proves the result with check and e2e. It generates first: gsxui's re-vendor runs gsx generate,
# which needs the uncommitted generated code (the gsxui translator, ui/i18n/intl_gen.go) a fresh checkout doesn't have.
# It stages docs/commands.md and .claude/skills: a moved pin changes a task description (htmx's version) or a skill
# (charter's, which charter init writes), and test:go compares both with the index.
["outdated"]
description = "Every pin with a newer version upstream (Go modules in every module, mise's tools, gsxui's commit, Chrome, htmx, the npm locks), deps.toml's holds marked"
dir = "{{config_root}}"
run = "go run ./internal/deps outdated"

["update"]
description = "Move every pin not held in deps.toml to its latest (gsx, gsxui and structpages, then Go modules, mise's tools and their copies, charter with charter init, Chrome, htmx, the npm locks), tidy every module, regenerate, then check and e2e"
depends = ["generate"]
dir = "{{config_root}}"
run = ["go run ./internal/deps update", "mise run docs:commands", "git add docs/commands.md .claude/skills", "mise run check", "mise run e2e"]

# What the app's Go needs before it builds: the messages package from the catalogs (mise-intl's intl:gen), then the
# components' code (gsx:generate). Every build/run/test path depends on this.
["generate"]
description = "The messages package from the catalogs (intl:gen), then gsx:generate for the app's markup"
depends = ["intl:gen"]
run = "mise run gsx:generate"

# The languages (mise-intl, docs/intl/README.md) and what search engines read (mise-seo, docs/seo/README.md): the few
# of their commands this app uses, each the tool's own binary (mise.toml pins it).
["intl:gen"]
description = "The catalogs (locales/*.toml) compiled into the app's messages package, locales/intl_gen.go, and intl.sum"
dir = "{{config_root}}"
sources = ["locales/*.toml", "intl.toml", "ui/**/*.gsx", "views/**/*.gsx"]
outputs = ["locales/intl_gen.go", "ui/i18n/intl_gen.go"]
run = "mise-intl gen"

["intl:status"]
description = "Per language: translated, inherited, stale, missing; fails while one is incomplete"
run = "mise-intl status"

["intl:todo"]
description = "What's left to translate, with what a translator needs (--json for agents)"
usage = 'flag "--json" help="one JSON document on stdout"; arg "[locales]..." help="only these languages"'
run = 'mise-intl todo{% if usage.json %} --json{% endif %}{% for a in usage.locales %} "{{a}}"{% endfor %}'

["intl:translate"]
description = "Claude Code translates what's left, a worker per language, with the intl skill"
usage = 'arg "[locales]..." help="only these languages"'
run = 'mise-intl translate{% for a in usage.locales %} "{{a}}"{% endfor %}'

["intl:confirm"]
description = "Stale translations that are still right, kept: a language's (de), or one message's (de:home.title)"
usage = 'arg "[keys]..." help="de, or de:home.title"'
run = 'mise-intl confirm{% for a in usage.keys %} "{{a}}"{% endfor %}'

["seo:audit"]
description = "The site as Googlebot reads it: robots.txt, the sitemap and every page in it (--site: a local build or a preview)"
usage = 'flag "--json" help="one JSON document on stdout"; flag "--site <url>" help="another server than the site in seo.toml"'
run = 'mise-seo audit{% if usage.json %} --json{% endif %}{% if usage.site %} --site "{{usage.site}}"{% endif %}'

["seo:lighthouse"]
description = "Lighthouse on the live site, on Google's servers: every page or the one named; fails under seo.toml's minimum"
usage = 'flag "--json" help="one JSON document on stdout"; arg "[page]" help="one page, a path like /de/board; default every page"'
run = 'fnox exec -- mise-seo lighthouse{% if usage.json %} --json{% endif %}{% if usage.page %} "{{usage.page}}"{% endif %}'

["seo:badges"]
description = "Lighthouse on every page and the audit, then the README's badges and its scores table; run after a production release, then commit"
run = "fnox exec -- mise-seo badges"

# The Static Assets directory: /static/ = web/htmx/ (htmx, hx-ws) and intl's browser module, /gsxui/ = web/gsxui/
# behaviours, /blocks/ = web/blocks/ (the map's and the live video's browser files), /assets/ = gsxui's compiled CSS (gsxui:css)
# + fonts (fonts.css url()s are relative).
["assets"]
description = "Assemble dist/site, the Static Assets for workerd and deploy: htmx, intl's browser module, gsxui's behaviours, the map's and the live video's browser files, CSS and fonts"
depends = ["vendor", "js:bundle", "gsxui:css"]
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
rm -rf dist/site
mkdir -p dist/site/static dist/site/gsxui dist/site/assets
# htmx and its extensions as one deferred script (/static/htmx.js): out of the way of the first paint, and in one
# script, so the extensions register before htmx's start, which a deferred htmx runs on the next task (setTimeout).
# htmx.min.js goes in exactly as htmx ships it: minifying it again gained nothing and, through tdewolff/minify#1057,
# dropped its morph's text updates, so boosted navigation mixed pages (#168). The extensions are minified here.
{ cat web/htmx/htmx.min.js; echo ";"; for f in hx-live.js hx-ws.js; do go tool minify -q --type=js "web/htmx/$f"; echo ";"; done; } >dist/site/static/htmx.js
# the map's and the live video's browser files (/blocks/: the map's Leaflet, the live video's @moq elements), each loaded only by
# a page with that component on it.
mkdir -p dist/site/blocks
cp -R web/blocks/. dist/site/blocks/
# The site's icon (<link rel="icon"> in the layout, which browsers and Google read).
cp web/favicon.svg dist/site/static/
# The browser's half of intl, with the same intl.mjs the Worker runs (/static/intl-browser.mjs).
mise-intl assets -browser dist/site/static
cp -R web/gsxui/. dist/site/gsxui/
cp dist/gsxui.css dist/site/assets/
cp web/gsxui/fonts/*.woff2 dist/site/assets/
# Every script of ours not yet minified, minified (tdewolff/minify, a Go tool): Lighthouse counts what the browser
# downloads. Never one already minified (htmx above, the esbuild bundles): a second pass gains nothing and only risks
# it (TestServedScripts).
find dist/site/static dist/site/gsxui \( -name '*.js' -o -name '*.mjs' \) ! -name htmx.js | xargs go tool minify -q -i --type=js
echo "✓ dist/site: $(find dist/site -type f | wc -l | tr -d ' ') files, gsxui.css $(wc -c <dist/site/assets/gsxui.css | tr -d ' ')B"
'''

["build"]
depends = ["generate", "assets"]
description = "Production build → build/ with WORKER_COMPILER (mise.toml: go, or tinygo), size-checked (deploy, staging, CI and the tests use it)"
dir = "{{config_root}}"
# Skipped when no input changed since the last production build, so `check` then `e2e` (CI: charter ci run) builds once.
# Inputs: every Go file (the generated *.x.go included), the module files, mise.toml (a Go/TinyGo/workers-go pin
# change must rebuild), and ci/wasm-build.sh (its build flags, such as the heap). Nothing else feeds the wasm: Static
# Assets are dist/site, served beside it. build/.prod marks a production build; build:dev removes it, so a debug wasm is
# never skipped into a deploy.
sources = ["**/*.go", "go.mod", "go.sum", "intl/go.mod", "mise.toml", "ci/wasm-build.sh", "intl/js/*.mjs", "locales/intl-messages.mjs"]
outputs = ["build/app.wasm", "build/go.mjs", "build/worker.mjs", "build/runtime.mjs", "build/wasm_exec.js", "build/hub.mjs", "build/websocket.mjs", "build/tinygo-clock.mjs", "build/intl.mjs", "build/intl-worker.mjs", "build/intl-messages.mjs", "build/.prod"]
env = { WASM_PROFILE = "prod" }
run = "ci/wasm-build.sh"

["build:dev"]
depends = ["generate", "assets"]
description = "Dev build → build/: standard Go to wasm, seconds after an edit (mise run dev uses it; never deployed)"
dir = "{{config_root}}"
sources = ["**/*.go", "go.mod", "go.sum", "intl/go.mod", "mise.toml", "intl/js/*.mjs", "locales/intl-messages.mjs"]
outputs = ["build/app.wasm", "build/go.mjs", "build/worker.mjs", "build/runtime.mjs", "build/wasm_exec.js", "build/hub.mjs", "build/websocket.mjs", "build/tinygo-clock.mjs", "build/intl.mjs", "build/intl-worker.mjs", "build/intl-messages.mjs", "build/.dev"]
env = { WASM_PROFILE = "dev" }
run = "ci/wasm-build.sh"

# The dev loop (gsx CLI, gsx.toml [dev]): the real runtime (Intl, Durable Objects, D1, the board), build:dev
# (standard Go, seconds per save) + workerd.
# JS and CSS edits (web/htmx/, intl/js, web/gsxui) need no Go build: mise run assets, then reload.
["dev"]
description = "gsx dev → build:dev (standard Go, seconds) + CSS → workerd restart on every .gsx/.go save → http://localhost:8913 (PORT: another port)"
# charter serve (gsx.toml's [dev] run) listens on PORT, gsx dev proxies APP_DEV_PORT: the same port, charter.toml's
# 8913 by default (TestCharterToml).
run = 'export PORT=${PORT:-8913} && export APP_DEV_PORT=$PORT && exec go tool gsx dev'

# Live logs of the deployed Worker (charter tail): requests, console output, exceptions. Ctrl-C deletes the tail.
["tail"]
description = "Stream the deployed Worker's live logs (requests, console, exceptions) → Ctrl-C to stop"
run = "fnox exec -- charter tail"

["serve"]
description = "The production build (WORKER_COMPILER) on local workerd (charter serve: charter.toml's port, your time zone), static files first → http://localhost:8913"
depends = ["build"]
dir = "{{config_root}}"
run = "exec charter serve"

# go test runs the handlers on standard Go, which hides TinyGo runtime gaps (html/template panics, pre-1.22
# ServeMux). So also run the production build under workerd and check every route over HTTP. SMOKE_BASE=https://…
# (e.g. "$(cat .deploy-url)") checks a deployed Worker instead.
["smoke"]
description = "The production build on local workerd, every route checked over HTTP (e2e/smoke); SMOKE_BASE=https://… checks a deployed Worker"
depends = ["build"]
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ -n "${SMOKE_BASE:-}" ]; then echo "→ $SMOKE_BASE"; exec go test -C e2e -count=1 -v ./smoke; fi
# On workerd (charter with: a free port, fresh state); a panic or uncaught exception in its log fails it too.
exec charter with -strict sh -c 'SMOKE_BASE=$BASE SMOKE_LOCAL=1 go test -C e2e -count=1 ./smoke'
'''

# Real-browser checks (e2e/: Go + chromedp + headless Chrome, no Node): pages, the live board across two browsers,
# boosted navigation ↔ board presence, bare-close presence, the write limit. Starts local workerd unless E2E_BASE
# points at a deployed Worker. CI runs it too (charter.toml's [ci] test).
["e2e"]
description = "Headless Chrome checks: pages, live board in two browsers, boost ↔ board, presence, Intl, write limit (local workerd, or E2E_BASE=https://…)"
depends = ["build"]
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# chromedp logs CDP events it doesn't model ("unhandled node event"); they're noise.
e2e() { E2E_BASE=$1 E2E_CHROME="$(mise which chrome-headless-shell)" go test -C e2e -count=1 -v . 2>&1 | grep -v "unhandled node event"; return "${PIPESTATUS[0]}"; }
if [ -n "${E2E_BASE:-}" ]; then echo "→ $E2E_BASE"; e2e "$E2E_BASE"; else export -f e2e; charter with bash -c 'e2e "$BASE"'; fi
'''

# CPU per request on local workerd (charter bench): what Cloudflare bills a Worker for, measured
# without Cloudflare. CI runs `bench` and puts the table in its summary.
["bench"]
description = "CPU per request of the production build on local workerd, per page, repeated runs (charter bench)"
depends = ["build"]
dir = "{{config_root}}"
run = "ci/bench.sh"

# CI's CPU table (charter.toml's [ci] test): one short run into the run's summary, so a slower page shows on every PR.
# CI's machines vary: for spotting a jump, not for the numbers in docs/benchmarks.md.
["ci:bench"]
description = "CI: one short CPU-per-request run of the build on workerd, into the GitHub run's summary (charter.toml [ci] test)"
depends = ["build"]
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
BENCH_N=30 BENCH_RUNS=1 ci/bench.sh | tee build/bench.txt
if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
  { echo; echo "CPU per request on workerd (ms, mise run bench):"; echo; echo '```'; grep -E "median|CPU per request" build/bench.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
fi
'''

["bench:variants"]
description = "Build the current code with each of charter's optimisations off in turn, measure each, write docs/benchmarks.md"
depends = ["generate", "assets"]
dir = "{{config_root}}"
run = "ci/bench.sh variants"

# Design size: 1,000 WebSockets on one topic, then a burst of 50 concurrent writes (coalescing), then socket 1,001
# refused (e2e/load). Starts its own workerd (charter with) unless LOAD_BASE points somewhere else (e.g. the
# deployed URL).
["load"]
description = "1,000 WebSockets in every locale on one topic, a 50-write burst, socket 1,001 refused (e2e/load; local workerd, or LOAD_BASE=https://…)"
depends = ["build"]
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
ulimit -n 8192
if [ -n "${LOAD_BASE:-}" ]; then echo "→ $LOAD_BASE"; exec go test -C e2e -count=1 -v -timeout 10m ./load; fi
exec charter with sh -c 'LOAD_BASE=$BASE go test -C e2e -count=1 -v -timeout 10m ./load'
'''

["test"]
description = "Everything before a push: the production build + workerd smoke, and the Go checks (mise run check is the same)"
alias = "check"
# smoke (production build + workerd) and test:go (no wasm needed) run in parallel.
depends = ["smoke", "test:go"]
# Against upstream checkouts (mise run upstream:use) every step still runs, for trying them, but the check fails:
# what merges must have passed with the pinned versions.
run = '[ ! -s .upstream-use ] || { echo "✗ ran with upstream checkouts: $(tr "\\n" " " <.upstream-use)(mise run upstream:unuse <repo>)"; exit 1; }; echo "✓ test: smoke + test:go"'

["test:go"]
description = "go.mod tidy, gsx fmt and gofmt, go vet, structpages-lint, go test, every language complete, then charter's own check (standard Go; runs beside the production build)"
# assets: TestServedScripts reads dist/site. Without it a new checkout's first run raced the build for those files.
depends = ["generate", "assets"]
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# Each module's go.mod and go.sum as go mod tidy writes them (the app's, and e2e's: the browser tests).
for mod in $(git ls-files 'go.mod' '*/go.mod'); do
  go -C "$(dirname "$mod")" mod tidy -diff >/dev/null || { echo "✗ $(dirname "$mod")/go.mod isn't tidy: go -C $(dirname "$mod") mod tidy"; exit 1; }
done
mise run gsx:fmt --check
# Files of this module only (gofmt -l . would walk e2e's too); IgnoredGoFiles are the other platform's build-tagged files.
unformatted=$(gofmt -l $(go list -json ./... | jq -r '.Dir as $d | (.GoFiles + (.TestGoFiles // []) + (.XTestGoFiles // []) + (.IgnoredGoFiles // []))[] | "\($d)/\(.)"'))
test -z "$unformatted" || { echo "$unformatted"; echo "✗ gofmt: files need formatting"; exit 1; }
go vet ./...
# structpages' linter: links, ids and partials from the page tree, and htmx 4's target selector.
mise run -q structpages:lint
# With Intl as a Worker has it (ci/with-intl.sh): the tests render and format through it, and mise-intl says whether
# every language is complete.
ci/with-intl.sh sh -c 'go test ./... && mise-intl status'
# charter.toml and charter's files here (its tasks, Workers Builds' launcher, its skill, the CI workflow).
charter check
# The skills gsx, gsxui and structpages ship are installed at the versions the app pins, and committed.
go run ./internal/deps skill >/dev/null
{ git diff --quiet -- .claude/skills && test -z "$(git ls-files --others --exclude-standard -- .claude/skills)"; } ||
  { git status --short -- .claude/skills; echo "✗ .claude/skills isn't what mise run gsx:skill installs: run it, and commit"; exit 1; }
# e2e/ is its own module (chromedp): format and vet it too. Its tests need a server (mise run smoke / e2e / load),
# except the load checker's own, which run against an in-process fake.
test -z "$(gofmt -l e2e)" || { gofmt -l e2e; echo "✗ gofmt: e2e/ needs formatting"; exit 1; }
go vet -C e2e ./...
go test -C e2e ./load
# docs/commands.md is generated from the task descriptions: a changed task must regenerate it.
mise run -q docs:commands >/dev/null
git diff --quiet -- docs/commands.md || { git --no-pager diff --stat -- docs/commands.md; echo "✗ docs/commands.md was stale: regenerated, commit it"; exit 1; }
'''

["docs:commands"]
description = "Regenerate docs/commands.md from these task descriptions (mise generate task-docs); test:go fails when it's stale"
dir = "{{config_root}}"
run = "{ cat docs/commands-intro.md; mise generate task-docs | sed 's/^## /### /'; } >docs/commands.md"

# ── token-check ─────────────────────────────────────────────────
# Credentials come from fnox via mise (global keychain config). The inner sh -c '…' is
# single-quoted so $CLOUDFLARE_API_TOKEN expands after fnox has injected it.
["token-check"]
description = "Verify CLOUDFLARE_API_TOKEN (from fnox) against the Cloudflare API (charter token)"
run = "fnox exec -- charter token"

# ── deploy ──────────────────────────────────────────────────────
# Direct Upload via charter deploy (Go, no wrangler), from charter.toml: the Worker and its D1, Durable
# Objects, rate limit, vars and domain. Runs the full local test (TinyGo build + workerd smoke + go test) and the token
# check first. Credentials: CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID from the environment, else fnox.
["deploy"]
description = "Test, then deploy production → https://$APP_DOMAIN (or $APP_NAME.<subdomain>.workers.dev), then seo:audit live"
depends = ["test", "token-check"]
# Google must be able to crawl what was just deployed (seo/README.md).
depends_post = ["seo:audit"]
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cf() { if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then "$@"; else fnox exec -- "$@"; fi; }
# SMOKE_BASE/E2E_BASE/LOAD_BASE=$(cat .deploy-url): the custom domain when there is one.
cf charter deploy production | tee .deploy-url
'''

# ── staging ─────────────────────────────────────────────────────
# Staging: its own Worker $APP_NAME-staging (https://$APP_NAME-staging.<subdomain>.workers.dev), exactly what's on main.
# Workers Builds deploys it on every merge to main (.mise/tasks/charter-builds → charter builds deploy). Like production, but never production: no
# custom domain (seo.Site never redirects), APP_PREVIEW=1 (noindex), its own D1 ($APP_NAME-staging) and Durable Objects.
["staging"]
description = "Test, then deploy staging: the Worker $APP_NAME-staging → its URL on stdout and in .staging-url"
depends = ["test"]
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cf() { if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then "$@"; else fnox exec -- "$@"; fi; }
cf charter deploy staging | tee .staging-url
'''

# ── preview ─────────────────────────────────────────────────────
# A Worker Preview of $APP_NAME (PR #6): its own URL, code and Durable
# Object storage, the shared preview D1 ($APP_NAME-preview), no custom domain (so seo.Site never redirects it) and
# APP_PREVIEW=1 (every response noindex). Workers Builds runs it for every pushed branch (name = the branch).
# Credentials: CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID from the environment (Workers Builds' build token) or fnox.
["preview"]
description = "Test, then deploy a Worker Preview named after the branch (or e.g. pr-7) → its URL on stdout and in .preview-url"
depends = ["test"]
dir = "{{config_root}}"
usage = 'arg "[name]" help="preview name, e.g. pr-7; the branch unless named"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
cf() { if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then "$@"; else fnox exec -- "$@"; fi; }
ann=(-annotation "workers/commit_sha=$(git rev-parse HEAD)")
[ -z "${APP_REPO:-}" ] || ann+=(-annotation "workers/repository_url=https://github.com/$APP_REPO")
cf charter deploy preview "${usage_name:-$(git branch --show-current)}" "${ann[@]}" | tee .preview-url
'''

# ── release ─────────────────────────────────────────────────────
# Production without anyone's machine holding Cloudflare credentials: a v* tag (GitHub's Releases page) or a
# release/v* branch (mise run release) on a commit that's on main. CI (charter ci run) tests it, then moves the production
# branch to it, and Workers Builds' branch trigger deploys production
# with its own build token (charter builds deploy sees the branch → production). A tag from GitHub's Releases page does the same. Roll
# back by tagging an older commit of main.
["release"]
description = "Release main to production (e.g. v1.3): CI tests it, tags it (and intl/seo with their next version when they changed), Workers Builds deploys it; no Cloudflare credentials needed"
dir = "{{config_root}}"
usage = 'arg "<version>" help="the release, e.g. v1.3"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
v=$usage_version
[[ $v == v* ]] || { echo "✗ $v: releases start with v (v1.3)"; exit 1; }
git fetch -q origin main
# A release/v* branch, not a tag: some places (Claude's cloud sandbox) can push branches but not tags. CI makes the tag.
git push origin "origin/main:refs/heads/release/$v"
echo "✓ release/$v → $(git rev-parse --short origin/main): CI tests it, tags $v, Workers Builds deploys production"
'''
