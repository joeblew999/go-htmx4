# charter.toml: go-htmx4 on Cloudflare, every fact about the Worker once (github.com/joeblew999/charter: go doc
# github.com/joeblew999/charter/go/lib/project). go tool charter reads it: deploy production|staging|preview, and
# local, serve and with (.charter/, workerd's config and stand-ins, generated from it). TestCharterToml checks the copies
# kept elsewhere against it (mise.toml's APP_NAME and APP_DOMAIN, the dev port).
name = "go-htmx4"
# Must not be newer than the workerd binary's date (mise.toml): workerd runs the Worker with it locally, Cloudflare in
# production.
compatibility_date = "2026-09-11"
main = "worker/index.mjs"
modules = ["worker/room.mjs"]
assets = "dist/site"
health = "/healthz"
port = 8913
# Where CI publishes each commit's build for Workers Builds (go tool charter ci publish, builds), and the account's
# workers.dev subdomain: a branch's preview is https://<branch>-go-htmx4.gedw99.workers.dev.
repo = "joeblew999/go-htmx4"
subdomain = "gedw99"

# The board: D1 is the source of truth. A new migration is a new idempotent file here.
[[d1]]
binding = "DB"
migrations = "migrations"

# One Room per topic fans the board out over hibernated WebSockets (worker/room.mjs). A new class takes a new migration.
[[durable_objects]]
binding = "ROOM"
class = "Room"
migration = "v1"

# Every write handler calls s.limited first: 60 writes per 10 s per IP.
[[rate_limits]]
binding = "WRITES"
namespace_id = 1001
limit = 60
period = 10

[production]
domain = "go-htmx4.ubuntusoftware.net"
vars = { APP_ENV = "cloudflare", APP_DOMAIN = "go-htmx4.ubuntusoftware.net" }

# Exactly what's on main: its own Worker and D1, no custom domain, noindex (APP_PREVIEW).
[staging]
vars = { APP_ENV = "staging", APP_PREVIEW = "1" }

# A Worker Preview per branch: the shared preview D1, noindex.
[preview]
vars = { APP_ENV = "preview {preview}", APP_PREVIEW = "1" }
note = "Own Durable Object storage, shared preview D1, not indexed."

[local]
vars = { APP_ENV = "workerd (local)" }

# The build: the Worker (TinyGo), intl's Worker modules, the Static Assets (tasks/app.toml).
[build]
command = "mise run build"

# CI (.github/workflows/charter.yml → go tool charter ci run): only the tools it runs; the build beside the Go tests and
# the fresh apps, then published for the commit's preview; then workerd, Chrome and the CPU table; a release also tags
# intl, seo and badge with their next versions before production moves.
[ci]
tools = ["go", "go@1.26", "tinygo", "github:WebAssembly/binaryen", "github:tailwindlabs/tailwindcss", "workerd", "http:chrome-headless-shell", "jq"]
build = "mise run build ::: test:go ::: fresh"
test = "mise run --skip-deps smoke && mise run --skip-deps e2e && mise run --skip-deps ci:bench"
release_hook = "ci/module-tags.sh \"$GITHUB_SHA\""
