# The text of intl's screens (go tool intl add language-list | language-offer | preferences), the source: go tool intl
# add writes it, and its translations beside it, into an app's catalogs. ICU MessageFormat, as in any catalog.

# intl's screens: the language list, the offer of the page in the reader's language, the time zone and clock dialog.
[intl]
# The language list's name, a landmark around its links to the page in every language (and a good name for a header
# button that jumps to it).
languages = "Languages"
# Above every page until the reader chooses a language, when they chose another or their browser asks for another
# the site has: written in that language, linking to the page in it. {language} is the language's own name ("Deutsch").
also_in = "This page is also in {language}."
# Below intl.also_in, in the same language: a link that turns the offer down and keeps the page in its language.
no_thanks = "No thanks"
# The time zone and clock dialog: its button's name and its title.
preferences = "Time zone and clock"
# Under the dialog's title.
preferences_description = "Dates and times on every page use these settings. Automatic uses your browser's time zone."
# In the dialog while its form loads.
loading = "Loading…"
# The time zone menu's label, and its first choice: the zone the browser (or, until it reports one, the connection)
# is in, {zone} its name ("Automatic (Central European Time)").
time_zone = "Time zone"
time_zone_auto = "Automatic ({zone})"
# The clock menu's label, and its first choice: the language's own clock, {example} a time written in it ("Language
# default (2:30 PM)"). The other choices are example times in a 12-hour and a 24-hour clock.
hour_cycle = "Clock"
hour_cycle_auto = "Language default ({example})"
# The dialog's buttons.
save = "Save"
close = "Close"

# The text gsxui's components write themselves (i18n.T): go tool intl add writes what the app's components use.
[gsxui]
close = "Close"
notifications = "Notifications"
# Pagination's own links, and its "…" for pages left out.
previous = "Previous"
next = "Next"
more_pages = "More pages"
# Breadcrumb's "…" for levels left out.
more = "More"
# Carousel's arrow buttons.
previous_slide = "Previous slide"
next_slide = "Next slide"
# Calendar's arrow buttons, and the labels of its month and year menus.
previous_month = "Previous month"
next_month = "Next month"
month = "Month"
year = "Year"
# The sidebar's toggle button, its label, and the description screen readers hear for it on phones.
toggle_sidebar = "Toggle Sidebar"
sidebar = "Sidebar"
displays_the_mobile_sidebar = "Displays the mobile sidebar."
# Breadcrumb's and pagination's names as landmarks, and what screen readers call a carousel and each of its slides.
breadcrumb = "breadcrumb"
pagination = "pagination"
carousel = "carousel"
slide = "slide"
# Pagination's arrow links, as screen readers name them.
go_to_previous_page = "Go to previous page"
go_to_next_page = "Go to next page"
# A spinner, as screen readers name it.
loading = "Loading"
# The calendar's day buttons for today and for a selected day, as screen readers name them. '{date}' is literal, quotes
# included: gsxui's calendar script puts the whole day there ("Thursday, July 9, 2026").
today_date = "Today, '{date}'"
date_selected = "'{date}', selected"
