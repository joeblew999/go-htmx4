class_merger = "github.com/joeblew999/go-htmx4/demos/workers/ui/merge.Merge"

# gsx config for demos/workers (gsx Configuration guide).
# gsx's htmx preset predates htmx 4: add hx-action, and hx-ws:connect, which also carries a URL.
url_presets = ["htmx"]

[url_attrs]
names = ["hx-action", "hx-ws:connect"]

# gsx dev drives the Workers loop (gsx Configuration guide, [dev]): a .gsx/.go save regenerates, rebuilds the
# TinyGo worker + gsxui CSS, restarts workerd and probes /healthz. workerd listens on the fixed port in
# config.capnp, so upstream points there instead of gsx's GO_PORT. mise run demo:workers:dev
[dev]
no_web = true
build = ["mise", "run", "demo:workers:build"]
run = ["sh", "-c", "mkdir -p .workerd-state && exec workerd serve config.capnp"]
upstream = "http://127.0.0.1:8913"
health = "/healthz"
