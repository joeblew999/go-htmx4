# tasks/app.toml — the app's tasks: build, dev loops, tests, deploys, release. Every task, with when to use it:
# docs/commands.md (generated from the descriptions: mise run docs:commands).
#
# TinyGo (or WORKER_COMPILER) for what ships to Workers; standard Go for local-only code: go test/vet,
# charter's go tool workerdeploy/workertail, e2e/. No Node. Tools come from mise.toml.

# Vendor htmx 4.0.0 + the hx-ws and hx-live extensions from the npm registry tarball (integrity-checked,
# no npm).
["vendor"]
description = "Vendor htmx 4.0.0 htmx.min.js + ext/hx-ws.js + ext/hx-live.js into web/htmx/ (curl, integrity-checked)"
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
version=4.0.0
if [ -f web/htmx/hx-ws.js ] && [ -f web/htmx/hx-live.js ] && [ "$(cat web/htmx/.htmx-version 2>/dev/null)" = "$version" ]; then
  echo "· htmx $version (cached)"; exit 0
fi
meta=$(curl -sfL "https://registry.npmjs.org/htmx.org/$version")
url=$(jq -r .dist.tarball <<<"$meta"); integrity=$(jq -r .dist.integrity <<<"$meta")
tgz=$(mktemp); curl -sfL -o "$tgz" "$url"
algo=${integrity%%-*}; want=${integrity#*-}
[ "$(openssl dgst -"$algo" -binary "$tgz" | base64)" = "$want" ] || { echo "✗ integrity mismatch"; exit 1; }
tmp=$(mktemp -d); tar -xzf "$tgz" -C "$tmp" --strip-components 1
cp "$tmp/dist/htmx.min.js" web/htmx/htmx.min.js
cp "$tmp/dist/ext/hx-ws.js" web/htmx/hx-ws.js
cp "$tmp/dist/ext/hx-live.js" web/htmx/hx-live.js
echo "$version" > web/htmx/.htmx-version
rm -rf "$tgz" "$tmp"
echo "✓ htmx $version: web/htmx/htmx.min.js, web/htmx/hx-ws.js, web/htmx/hx-live.js"
'''

# gsx components (views/, ui/) → *.x.go, which are gitignored; every build/run/test path depends on this.
["generate"]
description = "go tool gsx generate (after intl: views write the generated messages); intl/'s and seo/'s own components too, which they commit for the apps that import them"
depends = ["intl"]
dir = "{{config_root}}"
run = ["go -C intl tool gsx generate -q .", "go -C seo tool gsx generate -q .", "go tool gsx generate"]

# gsxui (npm-free mode): compile web/gsxui/index.css with the standalone Tailwind CLI, then assemble the
# Static Assets directory: /static/ = web/htmx/ (htmx, hx-ws) and intl's browser module,
# /gsxui/ = web/gsxui/ behaviours, /assets/ = compiled CSS + fonts (fonts.css url()s are relative).
["assets"]
description = "Tailwind (gsxui CSS) + assemble dist/site (Static Assets for workerd and deploy)"
depends = ["vendor"]
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
tailwindcss -i web/gsxui/index.css -o dist/gsxui.css --minify 2>&1 | grep -v "^≈\|^$" || true
rm -rf dist/site
mkdir -p dist/site/static dist/site/gsxui dist/site/assets
# htmx and its extensions as one deferred script (/static/htmx.js): out of the way of the first paint, and in one
# script, so the extensions register before htmx's start, which a deferred htmx runs on the next task (setTimeout).
for f in htmx.min.js hx-live.js hx-ws.js; do cat "web/htmx/$f"; echo ";"; done >dist/site/static/htmx.js
# The site's icon (<link rel="icon"> in the layout, which browsers and Google read).
cp web/favicon.svg dist/site/static/
# The browser's half of intl, with the same intl.mjs the Worker runs (/static/intl-browser.mjs).
go tool intl assets -browser dist/site/static
cp -R web/gsxui/. dist/site/gsxui/
cp dist/gsxui.css dist/site/assets/
cp web/gsxui/fonts/*.woff2 dist/site/assets/
# Every script minified (tdewolff/minify, a Go tool): Lighthouse counts what the browser downloads.
find dist/site/static dist/site/gsxui -name '*.js' -o -name '*.mjs' | xargs go tool minify -q -i --type=js
echo "✓ dist/site: $(find dist/site -type f | wc -l | tr -d ' ') files, gsxui.css $(wc -c <dist/site/assets/gsxui.css | tr -d ' ')B"
'''

["build"]
depends = ["generate", "assets"]
description = "Production build → build/ with WORKER_COMPILER (mise.toml: tinygo or go), size-checked (deploy, staging, CI and the tests use it)"
dir = "{{config_root}}"
# Skipped when no input changed since the last production build, so `check` then `e2e` (CI, ci/check.sh) builds once.
# Inputs: every Go file (the generated *.x.go included), the module files, and mise.toml (a Go/TinyGo/workers-go pin
# change must rebuild). Nothing else feeds the wasm: Static Assets are dist/site, served beside it. build/.prod marks a
# production build; build:dev removes it, so a debug wasm is never skipped into a deploy.
sources = ["**/*.go", "go.mod", "go.sum", "intl/go.mod", "mise.toml", "intl/js/*.mjs", "locales/intl-messages.mjs"]
outputs = ["build/app.wasm", "build/go.mjs", "build/worker.mjs", "build/runtime.mjs", "build/wasm_exec.js", "build/hub.mjs", "build/websocket.mjs", "build/tinygo-clock.mjs", "build/intl.mjs", "build/intl-worker.mjs", "build/intl-messages.mjs", "build/.prod"]
env = { WASM_PROFILE = "prod" }
run = "ci/wasm-build.sh"

["build:dev"]
depends = ["generate", "assets"]
description = "Dev build → build/: standard Go to wasm, seconds after an edit (mise run dev uses it; never deployed)"
dir = "{{config_root}}"
sources = ["**/*.go", "go.mod", "go.sum", "intl/go.mod", "mise.toml", "intl/js/*.mjs", "locales/intl-messages.mjs"]
outputs = ["build/app.wasm", "build/go.mjs", "build/worker.mjs", "build/runtime.mjs", "build/wasm_exec.js", "build/hub.mjs", "build/websocket.mjs", "build/tinygo-clock.mjs", "build/intl.mjs", "build/intl-worker.mjs", "build/intl-messages.mjs", "build/.dev"]
env = { WASM_PROFILE = "dev" }
run = "ci/wasm-build.sh"

# The dev loop (gsx CLI, gsx.toml [dev]): the real runtime (Intl, Durable Objects, D1, the board), build:dev
# (standard Go, seconds per save) + workerd.
# JS and CSS edits (web/htmx/, intl/js, web/gsxui) need no Go build: mise run assets, then reload.
["dev"]
description = "gsx dev → build:dev (standard Go, seconds) + CSS → workerd restart on every .gsx/.go save → http://localhost:8913"
env = { APP_DEV_PORT = "8913" }
run = "go tool gsx dev"

# Live logs of the deployed Worker (charter's workertail): requests, console output, exceptions. Ctrl-C deletes the tail.
["tail"]
description = "Stream the deployed Worker's live logs (requests, console, exceptions) → Ctrl-C to stop"
run = "fnox exec -- go tool workertail -name \"$APP_NAME\""

["serve"]
description = "The production build (WORKER_COMPILER) on local workerd, static files first → http://localhost:8913"
depends = ["build"]
dir = "{{config_root}}"
run = "mkdir -p .workerd-state && LOCAL_TIME_ZONE=$(ci/local-zone.sh) exec workerd serve worker/local/config.capnp"

# go test runs the handlers on standard Go, which hides TinyGo runtime gaps (html/template panics, pre-1.22
# ServeMux). So also run the production build under workerd and check every route over HTTP. SMOKE_BASE=https://…
# (e.g. "$(cat .deploy-url)") checks a deployed Worker instead.
["smoke"]
description = "The production build on local workerd, every route checked over HTTP (e2e/smoke); SMOKE_BASE=https://… checks a deployed Worker"
depends = ["build"]
dir = "{{config_root}}"
env = { WORKERD_STRICT = "1" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ -n "${SMOKE_BASE:-}" ]; then echo "→ $SMOKE_BASE"; exec go test -C e2e -count=1 -v ./smoke; fi
exec ci/with-workerd.sh smoke sh -c 'SMOKE_BASE=$BASE SMOKE_LOCAL=1 go test -C e2e -count=1 ./smoke'
'''

# Real-browser checks (e2e/: Go + chromedp + headless Chrome, no Node): pages, the live board across two browsers,
# boosted navigation ↔ board presence, bare-close presence, the write limit. Starts local workerd unless E2E_BASE
# points at a deployed Worker. CI runs it too (ci/check.sh).
["e2e"]
description = "Headless Chrome checks: pages, live board in two browsers, boost ↔ board, presence, Intl, write limit (local workerd, or E2E_BASE=https://…)"
depends = ["build"]
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# chromedp logs CDP events it doesn't model ("unhandled node event"); they're noise.
e2e() { E2E_BASE=$1 E2E_CHROME="$(mise which chrome-headless-shell)" go test -C e2e -count=1 -v . 2>&1 | grep -v "unhandled node event"; return "${PIPESTATUS[0]}"; }
if [ -n "${E2E_BASE:-}" ]; then echo "→ $E2E_BASE"; e2e "$E2E_BASE"; else export -f e2e; ci/with-workerd.sh e2e bash -c 'e2e "$BASE"'; fi
'''

# CPU per request on local workerd (charter's go tool workerbench): what Cloudflare bills a Worker for, measured
# without Cloudflare. CI runs `bench` and puts the table in its summary.
["bench"]
description = "CPU per request of the production build on local workerd, per page, repeated runs (charter's workerbench)"
depends = ["build"]
dir = "{{config_root}}"
run = "ci/bench.sh"

["bench:variants"]
description = "Build the current code with each of charter's optimisations off in turn, measure each, write docs/benchmarks.md"
depends = ["generate", "assets"]
dir = "{{config_root}}"
run = "ci/bench.sh variants"

# Design size: 1,000 WebSockets on one topic, then a burst of 50 concurrent writes (coalescing), then socket 1,001
# refused (e2e/load). Starts its own workerd on :8913 unless LOAD_BASE points somewhere else (e.g. the deployed URL).
["load"]
description = "1,000 WebSockets in every locale on one topic, a 50-write burst, socket 1,001 refused (e2e/load; local workerd, or LOAD_BASE=https://…)"
depends = ["build"]
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
ulimit -n 8192
if [ -n "${LOAD_BASE:-}" ]; then echo "→ $LOAD_BASE"; exec go test -C e2e -count=1 -v -timeout 10m ./load; fi
exec ci/with-workerd.sh load sh -c 'LOAD_BASE=$BASE go test -C e2e -count=1 -v -timeout 10m ./load'
'''

["test"]
description = "Everything before a push: the production build + workerd smoke, gsx fmt/gofmt, go vet, go test, the fresh-app test (mise run check is the same)"
alias = "check"
# smoke (production build + workerd), test:go (no wasm needed) and fresh run in parallel.
depends = ["smoke", "test:go", "fresh"]
# Against upstream checkouts (mise run upstream:use) every step still runs, for trying them, but the check fails:
# what merges must have passed with the pinned versions.
run = '[ ! -s .upstream-use ] || { echo "✗ ran with upstream checkouts: $(tr "\\n" " " <.upstream-use)(mise run upstream:unuse <repo>)"; exit 1; }; echo "✓ test: smoke + test:go + fresh"'

# The readiness test (#65): what an outside developer does, from nothing. If it fails, the repo isn't ready for them.
["fresh"]
description = "A brand-new gsx app outside this repo, made from intl's and seo's READMEs with this checkout's intl and seo (every go and gsx block in them is its code), with gsxui and intl's screens, served by an ordinary Go server in English and German; its go test, seo:audit and intl:check pass (e2e/fresh)"
dir = "{{config_root}}"
run = "go test -C e2e -count=1 -timeout 10m ./fresh"

["fresh:published"]
description = "The fresh-app test with intl and seo as published on the Go proxy (@latest), not this checkout: after a release, once the proxy has its tags, it shows the READMEs work for someone who runs go get"
dir = "{{config_root}}"
env = { FRESH_VERSIONS = "published" }
run = "go test -C e2e -count=1 -timeout 10m -run TestFreshApp ./fresh"

["test:go"]
description = "gsx fmt/gofmt check + go vet + go test, the app and intl/ (standard Go; runs beside the production build)"
depends = ["generate"]
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
go tool gsx fmt -l . || { echo "✗ gsx fmt: run 'go tool gsx fmt -w .'"; exit 1; }
# Files of this module only (gofmt -l . would walk the nested modules too); IgnoredGoFiles
# are the other platform's build-tagged files.
unformatted=$(gofmt -l $(go list -json ./... | jq -r '.Dir as $d | (.GoFiles + (.TestGoFiles // []) + (.XTestGoFiles // []) + (.IgnoredGoFiles // []))[] | "\($d)/\(.)"'))
test -z "$unformatted" || { echo "$unformatted"; echo "✗ gofmt: files need formatting"; exit 1; }
go vet ./...
go test ./...
# Every intl problem as CI sees it: the catalogs, then gsx's own checks on the markup (intl's intl:check). generate
# has already regenerated intl.sum and the languages badge, so a change to either (or a new one) means it wasn't
# committed.
mise run -q intl:check
generated=$(git status --porcelain -- locales/intl.sum docs/badges/intl.svg)
[ -z "$generated" ] || { echo "$generated"; echo "✗ go tool intl gen changed these: commit them"; exit 1; }
# intl/ is its own module, for any gsx app: format, vet and test it too (its tests run Intl on workerd).
test -z "$(gofmt -l intl)" || { gofmt -l intl; echo "✗ gofmt: intl/ needs formatting"; exit 1; }
go vet -C intl ./...
go test -C intl ./...
# seo/ is its own module too (Google Search Console and the live audit): format, vet and test it.
test -z "$(gofmt -l seo)" || { gofmt -l seo; echo "✗ gofmt: seo/ needs formatting"; exit 1; }
go vet -C seo ./...
go test -C seo ./...
# badge/ is its own module (the README badges intl and seo draw), so neither depends on the other.
test -z "$(gofmt -l badge)" || { gofmt -l badge; echo "✗ gofmt: badge/ needs formatting"; exit 1; }
go vet -C badge ./...
go test -C badge ./...
# intl, seo and badge declare the oldest Go they work with (their go.mod's go line, gsx's minimum): they must still
# build there, so the minimum can't creep up unnoticed.
for m in badge intl seo; do
  floor=$(sed -n 's/^go \([0-9]*\.[0-9]*\).*/\1/p' "$m/go.mod")
  (cd "$m" && env -u GOROOT GOTOOLCHAIN=local mise exec "go@$floor" -- go vet ./...) ||
    { echo "✗ $m/ doesn't build with Go $floor, the minimum its go.mod declares"; exit 1; }
done
# Its agent skill is installed from seo/ and committed: a change there must be installed and committed too.
go tool seo skill >/dev/null
{ git diff --quiet -- .claude/skills/seo && test -z "$(git ls-files --others --exclude-standard -- .claude/skills/seo)"; } ||
  { git status --short -- .claude/skills/seo; echo "✗ .claude/skills/seo is not seo/skills/seo: mise run seo:skill, and commit it"; exit 1; }
# e2e/ is its own module (chromedp): format and vet it too. Its tests need a server (mise run smoke / e2e / load),
# except the load checker's own, which run against an in-process fake.
test -z "$(gofmt -l e2e)" || { gofmt -l e2e; echo "✗ gofmt: e2e/ needs formatting"; exit 1; }
go vet -C e2e ./...
go test -C e2e ./load
# docs/commands.md is generated from the task descriptions: a changed task must regenerate it.
mise run -q docs:commands >/dev/null
git diff --quiet -- docs/commands.md || { git --no-pager diff --stat -- docs/commands.md; echo "✗ docs/commands.md was stale: regenerated, commit it"; exit 1; }
'''

["docs:commands"]
description = "Regenerate docs/commands.md from these task descriptions (mise generate task-docs); test:go fails when it's stale"
dir = "{{config_root}}"
run = "{ cat docs/commands-intro.md; mise generate task-docs | sed 's/^## /### /'; } >docs/commands.md"

# ── rename ───────────────────────────────────────────────────────────────────
# Make the template yours (GitHub "Use this template" or a clone): new Go module path and app name. The app name is
# the Worker + D1 name (APP_NAME), the brand in the header/titles and the local Durable Object keys.
["rename"]
description = "Make this template yours: mise run rename -- <module path> <app name>  (e.g. github.com/you/board board)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
module=${1:-}; name=${2:-}
if [ -z "$module" ] || [ -z "$name" ]; then echo "usage: mise run rename -- <module path> <app name>"; exit 2; fi
[[ "$name" =~ ^[a-z0-9][a-z0-9-]{0,52}$ ]] || { echo "✗ app name must be lowercase letters, digits and hyphens (it names the Worker)"; exit 1; }
old_module=$(go list -m)
old_name=$(sed -n 's/^APP_NAME = "\(.*\)"$/\1/p' mise.toml)
[ "$old_module" != "$module" ] || [ "$old_name" != "$name" ] || { echo "· already $module / $name"; exit 0; }
# Module path: every tracked Go, gsx and module file (untracked work is left alone); intl/ moves with the app.
git ls-files -z -- '*.go' '*.gsx' '*.gsx.tmpl' 'gsx.toml' 'go.mod' 'intl/go.mod' 'seo/go.mod' 'badge/go.mod' 'e2e/go.mod' | xargs -0 perl -pi -e "s#\\Q$old_module\\E#$module#g"
(cd e2e && go mod edit -module "$module/e2e")
# App name: config, pages, tests and local Durable Object keys.
perl -pi -e "s/^APP_NAME = \"\\Q$old_name\\E\"/APP_NAME = \"$name\"/" mise.toml
# The custom domain is the template owner's; a renamed copy has none until its owner sets APP_DOMAIN.
perl -pi -e 's/^APP_DOMAIN = ".*"/APP_DOMAIN = ""/' mise.toml
perl -pi -e 's/^site = ".*"/# site = "https:\/\/app.example.com"/' seo.toml
# Preview builds and Workers Builds: the repository follows a github.com module path; the subdomain is the owner's.
repo=""; [[ "$module" =~ ^github\.com/([^/]+/[^/]+)$ ]] && repo=${BASH_REMATCH[1]}
perl -pi -e "s#^APP_REPO = \".*\"#APP_REPO = \"$repo\"#" mise.toml
perl -pi -e 's/^CF_SUBDOMAIN = ".*"/CF_SUBDOMAIN = ""/' mise.toml
git ls-files -z -- views app main.go e2e tasks/app.toml worker/local/config.capnp | xargs -0 perl -pi -e "s/\\b\\Q$old_name\\E\\b/$name/g"
# Import blocks re-sort under the new path.
go tool gsx fmt -w . >/dev/null
git ls-files -z -- '*.go' | xargs -0 gofmt -w
go tool intl gen >/dev/null
go tool gsx generate >/dev/null
go build ./... && (cd e2e && go vet ./...)
echo "✓ module $old_module → $module, app $old_name → $name"
echo "  next: mise run check; set CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID in fnox; mise run deploy"
'''

# ── token-check ─────────────────────────────────────────────────
# Credentials come from fnox via mise (global keychain config). The inner sh -c '…' is
# single-quoted so $CLOUDFLARE_API_TOKEN expands after fnox has injected it.
["token-check"]
description = "Verify CLOUDFLARE_API_TOKEN (from fnox) against the Cloudflare API"
run = '''
fnox exec -- sh -c '
  [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "✗ CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID missing from fnox"; exit 1; }
  curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify \
    | jq -e ".success and .result.status == \"active\"" >/dev/null \
    && echo "✓ token active" || { echo "✗ token invalid or not active"; exit 1; }
'
'''

# ── deploy ──────────────────────────────────────────────────────
# Direct Upload via charter's workerdeploy (Go, no wrangler). Runs the full local test
# (TinyGo build + workerd smoke + go test) and the token check first. The Worker and D1 names are
# $APP_NAME (mise.toml [env]); updating an existing script of that name is allowed.
["deploy"]
description = "Test, then deploy production → https://$APP_DOMAIN (or $APP_NAME.<subdomain>.workers.dev), then seo:audit live"
depends = ["test", "token-check"]
# Google must be able to crawl what was just deployed (seo/README.md).
depends_post = ["seo:audit"]
dir = "{{config_root}}"
run = "ci/deploy.sh production"

# ── staging ─────────────────────────────────────────────────────
# Staging: its own Worker $APP_NAME-staging (https://$APP_NAME-staging.<subdomain>.workers.dev), exactly what's on main.
# Workers Builds deploys it on every merge to main (ci/workers-builds.sh). Like production, but never production: no
# custom domain (seo.Site never redirects), APP_PREVIEW=1 (noindex), its own D1 ($APP_NAME-staging) and Durable Objects.
["staging"]
description = "Test, then deploy staging: the Worker $APP_NAME-staging → its URL on stdout and in .staging-url"
depends = ["test"]
dir = "{{config_root}}"
run = "ci/deploy.sh staging"

# ── preview ─────────────────────────────────────────────────────
# A Worker Preview of $APP_NAME (PR #6): its own URL, code and Durable
# Object storage, the shared preview D1 ($APP_NAME-preview), no custom domain (so seo.Site never redirects it) and
# APP_PREVIEW=1 (every response noindex). Workers Builds runs it for every pushed branch (name = the branch).
# Credentials: CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID from the environment (Workers Builds' build token) or fnox.
["preview"]
description = "Test, then deploy a Worker Preview named after the branch (or e.g. pr-7) → its URL on stdout and in .preview-url"
depends = ["test"]
dir = "{{config_root}}"
usage = 'arg "[name]" help="preview name, e.g. pr-7; the branch unless named"'
run = 'ci/deploy.sh preview "${usage_name:-$(git branch --show-current)}"'

# ── release ─────────────────────────────────────────────────────
# Production without anyone's machine holding Cloudflare credentials: a v* tag (GitHub's Releases page) or a
# release/v* branch (mise run release) on a commit that's on main. CI (ci/check.sh) tests it, then moves the production
# branch to it, and Workers Builds' branch trigger deploys production
# with its own build token (ci/workers-builds.sh sees the branch → ci/deploy.sh production). A tag from GitHub's Releases page does the same. Roll
# back by tagging an older commit of main.
["release"]
description = "Release main to production (e.g. v1.3): CI tests it, tags it (and intl/seo with their next version when they changed), Workers Builds deploys it; no Cloudflare credentials needed"
dir = "{{config_root}}"
usage = 'arg "<version>" help="the release, e.g. v1.3"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
v=$usage_version
[[ $v == v* ]] || { echo "✗ $v: releases start with v (v1.3)"; exit 1; }
git fetch -q origin main
# A release/v* branch, not a tag: some places (Claude's cloud sandbox) can push branches but not tags. CI makes the tag.
git push origin "origin/main:refs/heads/release/$v"
echo "✓ release/$v → $(git rev-parse --short origin/main): CI tests it, tags $v, Workers Builds deploys production"
'''

# ── cf:builds ───────────────────────────────────────────────────
# Workers Builds (Cloudflare's GitHub app) as code: the repository connection and the "$APP_NAME branch previews"
# trigger running ci/workers-builds.sh, idempotent (PR #6). The one
# manual step: create the build token "$APP_NAME build token" in the dashboard once (the API can't). Until then
# it uses FALLBACK_BUILD_TOKEN if set.
["cf:builds"]
description = "Set up Workers Builds for $APP_REPO: every branch deploys (previews; production from the production branch), main deploys staging; idempotent"
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cf() { if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then "$@"; else fnox exec -- "$@"; fi; }
cf sh -c 'exec go tool workerdeploy -name "$APP_NAME" -repo "$APP_REPO" -configure-builds \
  -build-command "ci/workers-builds.sh build" -deploy-command "ci/workers-builds.sh deploy" \
  -build-token "$APP_NAME build token" -fallback-build-token "${FALLBACK_BUILD_TOKEN:-}" \
  -build-var "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" -path-exclude "*.md"'
'''
