# Runs ci/check.sh on every branch push: the production build, go test, smoke under workerd, headless Chrome (e2e).
# Strict no-Node: shell `run:` steps only, no JavaScript actions.
name: check

# Every branch push (a PR's checks are its head branch's push run). The build is also published for Cloudflare's
# preview of that commit (ci/check.sh → release "preview-builds"; ci/workers-builds.sh deploys it, compiling nothing).
on:
  push:

permissions:
  contents: write # upload the build to the "preview-builds" pre-release
  pull-requests: write # the preview URL comment

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # mise's GitHub downloads (no rate limit), the preview-builds upload and PR comment, and a release's tag and
      # production branch. Cloudflare credentials never come here: Workers Builds deploys.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out with git (no actions/checkout)
        run: |
          git init -q .
          git fetch -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git log --oneline -1

      - name: ci/check.sh
        run: ci/check.sh
