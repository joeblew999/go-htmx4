# mise.toml — go-htmx4
#
#   mise install        # install pinned tools
#   mise run run        # start the server on http://localhost:8080
#   mise run dev        # rebuild + restart on file changes
#   mise tasks          # list everything

[tools]
go = "1.27.1"
watchexec = "latest"   # used by `mise run dev`
tinygo = "0.42.0"      # workers-go TinyGo builds need >= 0.42.0 (net/http on wasm); supports Go <= 1.27
# wasm-opt, required by `tinygo build -target wasm`. The aqua registry lags (121),
# so pull the upstream release directly.
"github:WebAssembly/binaryen" = "version_132"
# gsx / gsxui toolchain (see .plans/2026-09-13_1109_adopt-gsxui.md). No Node anywhere.
# Tailwind standalone CLI — the npm-free path in https://ui.gsxhq.dev/docs/npm-free.
"github:tailwindlabs/tailwindcss" = "v4.3.3"
# gsxui has no tags yet: pin the commit (README: go install .../cmd/gsxui).
"go:github.com/gsxhq/gsxui/cmd/gsxui" = "c7fd6a8"
# gsx on PATH for the VS Code language server; builds use `go tool gsx` (gsx Status guide).
"go:github.com/gsxhq/gsx/cmd/gsx" = "v0.1.0"
# Cloudflare Workers toolchain (see .plans/2026-09-13_1111_adopt-workers-go.md). No Node, no wrangler.
# workerd: the standalone Workers runtime (what `wrangler dev` runs). Pin a release that has binaries.
workerd = "1.20260911.1"
# fnox: Cloudflare credentials from the keychain via `fnox exec -- …`.
fnox = "1.35.0"

[task_config]
includes = ["tasks/gsxui.toml", "tasks/workers.toml"]

[env]
# Respect an ADDR already set in the shell, e.g. `ADDR=:3000 mise run run`.
ADDR = "{{ get_env(name='ADDR', default=':8080') }}"

[tasks.run]
description = "Run the server (override address with ADDR=:3000)"
dir = "{{config_root}}"
run = "go run . -addr $ADDR"

[tasks.dev]
description = "Run the server and restart on .go / template / static changes"
dir = "{{config_root}}"
run = "watchexec --restart --exts go,html,js,css --ignore bin --ignore demos --ignore .upstream -- go run . -addr $ADDR"

[tasks.build]
description = "Build the binary into bin/"
dir = "{{config_root}}"
run = "go build -o bin/go-htmx4 ."

[tasks.fmt]
description = "Format Go code"
dir = "{{config_root}}"
run = "gofmt -w ."

[tasks.vet]
description = "Run go vet"
dir = "{{config_root}}"
run = "go vet ./..."

[tasks.test]
description = "Run tests"
dir = "{{config_root}}"
run = "go test ./..."

[tasks.check]
description = "fmt check + vet + test"
dir = "{{config_root}}"
run = '''
files=$(ls *.go)   # root module only; demos/ and .upstream/ have their own tasks
test -z "$(gofmt -l $files)" || { gofmt -l $files; echo "gofmt: files need formatting"; exit 1; }
go vet ./...
go test ./...
'''

[tasks."htmx:update"]
description = "Vendor a specific htmx version: mise run htmx:update 4.0.0"
dir = "{{config_root}}"
usage = 'arg "<version>" help="htmx.org version, e.g. 4.0.0"'
run = 'curl -sfL -o static/htmx.min.js "https://cdn.jsdelivr.net/npm/htmx.org@${usage_version}/dist/htmx.min.js" && echo "✓ htmx ${usage_version} → static/htmx.min.js"'

[tasks.clean]
description = "Remove build output"
dir = "{{config_root}}"
run = "rm -rf bin"
