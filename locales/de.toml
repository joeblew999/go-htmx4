slow_description = "Zu viele Änderungen von dieser Verbindung. In ein paar Sekunden erneut versuchen."
how_title = "So funktioniert die Pinnwand"
how_write = "Jede Änderung ist ein Formular-Post an einen Go-Handler im Worker. Er schreibt in D1, die SQLite-Datenbank von Cloudflare und die einzige Quelle der Wahrheit der Pinnwand, und erhöht die Version des Themas."
how_push = "Danach rendert der Handler die ganze Pinnwand einmal pro Sprache und übergibt sie dem Durable Object des Themas, das sie an jeden offenen Tab sendet. Im Browser wird nichts zusammengeführt: Jeder Push ersetzt die Pinnwand."
how_sockets = "Tabs bleiben mit hx-ws aus htmx 4 über WebSocket Hibernation verbunden, sodass tausend ruhende Tabs kaum etwas kosten, bis sich etwas ändert. Das Badge zählt, wer gerade hier ist."
how_order = "Jeder Push trägt die Version, aus der er entstanden ist. Ein Tab ignoriert einen Push, der älter ist als die angezeigte Pinnwand, sodass Änderungen, die sich im Netz kreuzen, nie zurückspringen."
how_limits = "Jede Verbindung kann 60 Änderungen in 10 Sekunden vornehmen, und ein Thema fasst bis zu 1.000 offene Tabs."

