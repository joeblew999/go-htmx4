# tasks/intl.toml — the app's languages, through github.com/joeblew999/go-htmx4/intl (intl/README.md): intl.toml says
# which, locales/*.toml holds their text (ICU MessageFormat).

["intl"]
description = "Compile locales/*.toml into the locales package, intl-messages.mjs and the gsxui translator (go tool intl gen, from intl.toml)"
# Skipped when the catalogs, intl.toml, the vendored gsxui components and intl itself are unchanged since the last run.
# intl's own renderer (intl/render.gsx) is committed generated, for the apps that import intl (gsx Package renderers).
sources = ["intl.toml", "locales/*.toml", "ui/*.gsx", "intl/*.gsx", "intl/gen/*.go", "intl/config/*.go", "intl/cmd/intl/*.go"]
outputs = ["locales/intl_gen.go", "locales/intl-messages.mjs", "ui/i18n/intl_gen.go", "intl/render.x.go"]
dir = "{{config_root}}"
run = ["go -C intl tool gsx generate -q .", "go tool intl gen"]
