# go-htmx4 UI strings: the source catalog. ICU MessageFormat 1 (plural, selectordinal, select, number).
# Translations live next to it as <locale>.toml with the same keys; `mise run i18n:messages` generates the typed
# accessors in this package (locales.For(ctx).HomeHeading(), …). Brand and technical names (gsx, htmx, D1,
# Durable Objects, TinyGo, Workers) stay as they are in every language.

