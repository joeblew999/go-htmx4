# mise.toml — go-htmx4: Go + htmx 4 demos (no Node anywhere)
#
#   mise install        # install pinned tools
#   mise run check      # test both demos (native + TinyGo under workerd)
#   mise tasks          # list everything (demo:gsxui:*, demo:workers:*, upstream:*)

[tools]
go = "1.27.1"
tinygo = "0.42.0"      # workers-go TinyGo builds need >= 0.42.0 (net/http on wasm); supports Go <= 1.27
# wasm-opt, required by `tinygo build -target wasm`. The aqua registry lags (121),
# so pull the upstream release directly.
"github:WebAssembly/binaryen" = "version_132"
# gsx / gsxui toolchain (see .plans/2026-09-13_1109_adopt-gsxui.md). No Node anywhere.
# Tailwind standalone CLI — the npm-free path in https://ui.gsxhq.dev/docs/npm-free.
"github:tailwindlabs/tailwindcss" = "v4.3.3"
# gsxui has no tags yet: pin the commit (README: go install .../cmd/gsxui).
"go:github.com/gsxhq/gsxui/cmd/gsxui" = "c7fd6a8"
# gsx on PATH for the VS Code language server; builds use `go tool gsx` (gsx Status guide).
"go:github.com/gsxhq/gsx/cmd/gsx" = "v0.1.0"
# Cloudflare Workers toolchain (see .plans/2026-09-13_1111_adopt-workers-go.md). No Node, no wrangler.
# workerd: the standalone Workers runtime (what `wrangler dev` runs). Pin a release that has binaries.
workerd = "1.20260911.1"
# fnox: Cloudflare credentials from the keychain via `fnox exec -- …`.
fnox = "1.35.0"

[task_config]
includes = ["tasks/gsxui.toml", "tasks/workers.toml"]

[tasks.check]
description = "Test both demos: gsxui (native + TinyGo on workerd) and workers (TinyGo on workerd + go test)"
depends = ["demo:gsxui:test", "demo:gsxui:workers:smoke", "demo:workers:test"]
