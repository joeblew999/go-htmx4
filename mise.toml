# mise.toml — go-htmx4: Go + htmx 4 + gsxui on Cloudflare Workers (no Node anywhere)
#
#   mise install        # install pinned tools
#   mise run dev        # gsx dev → TinyGo + workerd → http://localhost:8913
#   mise run check      # test everything (TinyGo under workerd + go test)
#   mise tasks          # list everything

[tools]
go = "1.27.1"
tinygo = "0.42.0"      # workers-go TinyGo builds need >= 0.42.0 (net/http on wasm); supports Go <= 1.27
# wasm-opt, required by `tinygo build -target wasm`. The aqua registry lags (121),
# so pull the upstream release directly.
"github:WebAssembly/binaryen" = "version_132"
# gsx / gsxui toolchain (see .plans/done/2026-09-13_1109_adopt-gsxui.md). No Node anywhere.
# Tailwind standalone CLI — the npm-free path in https://ui.gsxhq.dev/docs/npm-free.
"github:tailwindlabs/tailwindcss" = "v4.3.3"
# gsxui has no tags yet: pin the commit (README: go install .../cmd/gsxui).
"go:github.com/gsxhq/gsxui/cmd/gsxui" = "c7fd6a8"
# gsx itself is pinned in go.mod: builds use `go tool gsx` (gsx Status guide); the editor copy comes from `editor:gsx`.
# Cloudflare Workers toolchain (see .plans/done/2026-09-13_1111_adopt-workers-go.md). No Node, no wrangler.
# workerd: the standalone Workers runtime (what `wrangler dev` runs). Pin a release that has binaries.
workerd = "1.20260911.1"
# fnox: Cloudflare credentials from the keychain via `fnox exec -- …`.
fnox = "1.35.0"

[env]
# Worker script and D1 database name (mise run deploy): https://$APP_NAME.<subdomain>.workers.dev
APP_NAME = "go-htmx4"
# Custom domain (Workers Custom Domain, zone in the same Cloudflare account); "" = workers.dev only. When set, deploy
# attaches it and *.workers.dev 301s to it (host.go). mise run rename clears it.
APP_DOMAIN = "go-htmx4.ubuntusoftware.net"
# Locales the app ships (mise run i18n:generate); the first is the default and x-default.
I18N_LOCALES = "en,en-IN,de,fr,es,pt-BR,pt-PT,ar,he,ja,zh-Hans,zh-Hant,hi,ru"

[task_config]
includes = ["tasks/app.toml", "tasks/upstream.toml", "tasks/i18n.toml", "tasks/search.toml", "tasks/editor.toml"]

# The VS Code gsx language server needs the compiler where the extension looks (tasks/editor.toml).
[hooks]
postinstall = { task = "editor:gsx" }

[tasks.check]
description = "Test the app: TinyGo build + workerd smoke + gsx fmt/gofmt + go vet + go test"
depends = ["test"]
